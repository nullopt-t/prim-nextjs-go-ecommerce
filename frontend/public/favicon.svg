<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Left clip for dark stroke -->
    <clipPath id="left-half-prim">
      <rect x="0" y="0" width="256" height="512" />
    </clipPath>
    <!-- Right clip for terracotta stroke -->
    <clipPath id="right-half-prim">
      <rect x="256" y="0" width="256" height="512" />
    </clipPath>
  </defs>

  <!-- Background tile -->
  <rect 
    x="40" 
    y="40" 
    width="432" 
    height="432" 
    rx="96" 
    ry="96" 
    fill="#F3F3F3" 
  />

  <!-- Dual-tone border -->
  <rect 
    x="40" 
    y="40" 
    width="432" 
    height="432" 
    rx="96" 
    ry="96" 
    fill="none" 
    stroke="#333333" 
    stroke-width="12" 
    clip-path="url(#left-half-prim)" 
  />
  <rect 
    x="40" 
    y="40" 
    width="432" 
    height="432" 
    rx="96" 
    ry="96" 
    fill="none" 
    stroke="#C87A53" 
    stroke-width="12" 
    clip-path="url(#right-half-prim)" 
  />

  <!-- Full PRIM text -->
  <text 
    x="256" 
    y="292" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="115" 
    font-weight="900" 
    letter-spacing="-1"
  ><tspan fill="#111111">PRI</tspan><tspan fill="#C87A53">M</tspan></text>
</svg>
