<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:40px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:40px;">
                    <tr>
                        <td align="center">
                            <h2 style="margin:0;color:#111827;font-size:24px;">Verify Your Email</h2>
                            <p style="margin:20px 0;color:#4b5563;font-size:16px;line-height:1.5;">
                                Use the verification code below to sign in to your Prim account.
                            </p>
                            <div style="display:inline-block;padding:16px 36px;background:#f3f4f6;border:2px dashed #d1d5db;border-radius:8px;font-size:32px;font-weight:bold;letter-spacing:8px;color:#111827;">
                                {{ .Code }}
                            </div>
                            <p style="margin-top:24px;color:#9ca3af;font-size:14px;line-height:1.5;">
                                This code will expire in 5 minutes. If you did not request this, please ignore this email.
                            </p>
                            <hr style="margin:36px 0;border:none;border-top:1px solid #e5e7eb;">
                            <p style="font-size:12px;color:#9ca3af;margin:0;">
                                Prim Store Team
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
