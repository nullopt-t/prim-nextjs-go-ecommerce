server:
  port: "8081"
  env: "development"
  allowed_origins:
    - "http://localhost:3000"

database:
  host: "localhost"
  port: "5432"
  user: "prim"
  password: "prim"
  name: "prim"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

smtp:
  host: "smtp.gmail.com"
  port: 587
  username: ""
  password: ""

client:
  base_url: "http://localhost:3000"

minio:
  endpoint: "localhost:9000"
  public_url: "http://localhost:9000"
  access_key: "admin"
  secret_key: "supersecret"

secrets:
  jwt_access_secret: "dev-access-secret"
  jwt_refresh_secret: "dev-refresh-secret"
  jwt_reset_pass_secret: "dev-reset-secret"

auth:
  challenge_ttl_minutes: 5
  session_ttl_days: 30

rate_limit:
  auth_start_requests: 5
  auth_start_window_minutes: 1
  auth_resend_requests: 3
  auth_resend_window_minutes: 1
  auth_verify_requests: 10
  auth_verify_window_minutes: 1
