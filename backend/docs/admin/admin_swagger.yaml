basePath: /api/v1
definitions:
  AddressResponse:
    properties:
      city:
        description: City is the postal locality or city.
        type: string
      country:
        description: Country is the ISO or common country name.
        type: string
      postalCode:
        description: PostalCode is the postal or ZIP code.
        type: string
      state:
        description: State is the region, state, or province.
        type: string
      street:
        description: Street represents the primary street address lines.
        type: string
    type: object
  AdjustStockRequest:
    properties:
      quantity:
        description: Adjustment quantity delta (positive to increase, negative to
          decrease)
        example: 50
        type: integer
      reason:
        description: Business audit reason (restock, return, adjustment)
        enum:
        - restock
        - return
        - adjustment
        example: restock
        type: string
    required:
    - quantity
    - reason
    type: object
  AdminBrandResponse:
    properties:
      createdAt:
        description: Timestamp when brand was created (RFC3339)
        example: "2026-07-01T05:04:38Z"
        type: string
      deletedAt:
        description: Timestamp when brand was soft-deleted, if applicable
        example: "2026-07-01T05:04:38Z"
        type: string
      id:
        description: Internal database ID of the brand
        example: 358b2e03-0b3f-40a4-8163-ebed0cb252ee
        type: string
      link:
        description: Official website URL
        example: https://apple.com
        type: string
      logoUrl:
        description: Publicly accessible URL for the brand logo
        example: https://example.com/apple-logo.png
        type: string
      name:
        description: Brand/manufacturer name
        example: Apple
        type: string
      productCount:
        description: Number of active products associated with the brand
        example: 28
        type: integer
      updatedAt:
        description: Timestamp when brand was last updated (RFC3339)
        example: "2026-07-01T05:04:38Z"
        type: string
    type: object
  AdminCategoryResponse:
    properties:
      createdAt:
        description: Timestamp when category was created (RFC3339)
        example: "2026-06-30T15:47:19Z"
        type: string
      deletedAt:
        description: Timestamp when category was soft-deleted, if applicable
        example: "2026-07-01T10:00:00Z"
        type: string
      id:
        description: Internal database UUID of the category
        example: 40000000-0000-0000-0000-000000000002
        type: string
      name:
        description: Category name
        example: Electronics
        type: string
      parentId:
        description: Optional UUID of the parent category for nested tree hierarchies
        example: 40000000-0000-0000-0000-000000000001
        type: string
      parentName:
        description: Display name of the parent category, omitted for root categories
        example: Electronics
        type: string
      productCount:
        description: Number of active products assigned directly to this category
        example: 19
        type: integer
      updatedAt:
        description: Timestamp when category was last updated (RFC3339)
        example: "2026-06-30T15:47:19Z"
        type: string
    type: object
  AdminChangeSellerStatusRequest:
    properties:
      reason:
        description: Merchant-visible reason; required for rejection and suspension.
        maxLength: 2000
        type: string
      status:
        allOf:
        - $ref: '#/definitions/SellerStatus'
        description: New seller lifecycle state.
        enum:
        - pending
        - active
        - suspended
        - rejected
    required:
    - status
    type: object
  AdminProductDetailsResponse:
    properties:
      brand:
        allOf:
        - $ref: '#/definitions/ProductBrandSummary'
        description: Brand summary
      brandId:
        description: Associated brand ID
        example: 30000000-0000-0000-0000-000000000001
        type: string
      category:
        allOf:
        - $ref: '#/definitions/ProductCategorySummary'
        description: Category summary
      categoryId:
        description: Associated category ID
        example: 40000000-0000-0000-0000-000000000002
        type: string
      createdAt:
        description: Timestamp when product was created (RFC3339)
        example: "2026-08-05T19:00:00Z"
        type: string
      deletedAt:
        description: Timestamp when product was soft-deleted, if applicable
        example: "2026-08-05T19:30:00Z"
        type: string
      description:
        description: Product description
        example: Supercharged by M3 Pro or M3 Max.
        type: string
      highlights:
        description: Bullet highlights
        items:
          type: string
        type: array
      id:
        description: Product database UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      productType:
        description: 'Product classification: simple or variable'
        example: variable
        type: string
      slug:
        description: URL-friendly slug
        example: macbook-pro-16
        type: string
      status:
        allOf:
        - $ref: '#/definitions/PublicationStatus'
        description: 'Publication status: draft, published, archived'
        example: published
      tags:
        description: Product tags
        items:
          $ref: '#/definitions/ProductTagSummary'
        type: array
      thumbnail:
        allOf:
        - $ref: '#/definitions/StorageObjectResponse'
        description: Primary thumbnail storage object
      title:
        description: Product title
        example: MacBook Pro 16"
        type: string
      updatedAt:
        description: Timestamp when product was last updated (RFC3339)
        example: "2026-08-05T19:00:00Z"
        type: string
      variants:
        description: Full administrative variant details
        items:
          $ref: '#/definitions/AdminProductVariantResponse'
        type: array
      variationAxes:
        description: Ordered variation axis keys chosen from category attributes
        items:
          type: string
        type: array
    type: object
  AdminProductVariantResponse:
    properties:
      attributes:
        additionalProperties: {}
        description: Custom attributes
        type: object
      currency:
        description: Currency ISO code
        example: EGP
        type: string
      extractedOriginalPrice:
        description: Numeric original price
        example: 2999
        type: number
      extractedPrice:
        description: Numeric price value
        example: 2499
        type: number
      id:
        description: Variant database UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
      isDefault:
        description: Default variant flag
        example: true
        type: boolean
      media:
        description: Media gallery
        items:
          $ref: '#/definitions/VariantMediaSummary'
        type: array
      originalPrice:
        description: Formatted original price
        example: $2999.00
        type: string
      price:
        description: Formatted display price
        example: $2499.00
        type: string
      sku:
        description: Stock Keeping Unit
        example: MAC-PRO-16-BLK-18
        type: string
      stock:
        allOf:
        - $ref: '#/definitions/AdminStockSummary'
        description: Full administrative inventory breakdown
      thumbnail:
        allOf:
        - $ref: '#/definitions/StorageObjectResponse'
        description: Storage object metadata for thumbnail
      title:
        description: Variant title
        example: Space Black, 18GB RAM, 512GB SSD
        type: string
    type: object
  AdminSetCommissionRequest:
    properties:
      rateBps:
        description: Commission as basis points (0..10000).
        example: 1000
        maximum: 10000
        minimum: 0
        type: integer
    required:
    - rateBps
    type: object
  AdminStockSummary:
    properties:
      availableQuantity:
        description: Salable stock (onHand - reserved)
        example: 50
        type: integer
      isInStock:
        description: True if availableQuantity > 0
        example: true
        type: boolean
      onHandQuantity:
        description: Total physical stock in warehouse
        example: 60
        type: integer
      reservedQuantity:
        description: Stock reserved in active customer orders/checkouts
        example: 10
        type: integer
    type: object
  AdminTagResponse:
    properties:
      createdAt:
        description: Timestamp when tag was created (RFC3339)
        example: "2026-06-30T15:47:19Z"
        type: string
      deletedAt:
        description: Timestamp when tag was soft-deleted, if applicable
        example: "2026-06-30T15:47:19Z"
        type: string
      id:
        description: Unique database UUID identifier of the tag
        example: 50000000-0000-0000-0000-000000000001
        type: string
      name:
        description: Tag label name
        example: Featured
        type: string
      updatedAt:
        description: Timestamp when tag was last updated (RFC3339)
        example: "2026-06-30T15:47:19Z"
        type: string
    type: object
  AdminTransitionPayoutRequest:
    properties:
      notes:
        description: Admin notes, required for rejection reasons.
        maxLength: 2000
        type: string
      referenceNumber:
        description: External transfer reference (for processing/paid).
        example: PAY-2026-0001
        maxLength: 100
        type: string
      status:
        allOf:
        - $ref: '#/definitions/PayoutStatus'
        description: Target payout state; validated against the lifecycle by the service.
        enum:
        - approved
        - processing
        - paid
        - rejected
    required:
    - status
    type: object
  AdminVariantResponse:
    properties:
      attributes:
        additionalProperties: {}
        description: Custom variant attributes
        type: object
      createdAt:
        description: Timestamp when variant was created (RFC3339)
        example: "2026-08-02T16:00:00Z"
        type: string
      currency:
        description: Currency ISO code
        example: EGP
        type: string
      deletedAt:
        description: Timestamp when variant was soft-deleted, if applicable
        example: "2026-08-02T16:15:00Z"
        type: string
      extractedOriginalPrice:
        description: Numeric original price value
        example: 2999
        type: number
      extractedPrice:
        description: Numeric active price value
        example: 2499
        type: number
      id:
        description: Variant database UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
      isDefault:
        description: True if this is the default variant
        example: true
        type: boolean
      media:
        description: Attached gallery media assets
        items:
          $ref: '#/definitions/VariantMediaSummary'
        type: array
      originalPrice:
        description: Formatted original crossed-out price
        example: $2999.00
        type: string
      price:
        description: Formatted active display price
        example: $2499.00
        type: string
      productId:
        description: Parent product UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      sku:
        description: Stock Keeping Unit
        example: MAC-PRO-16-BLK-18
        type: string
      thumbnail:
        allOf:
        - $ref: '#/definitions/StorageObjectResponse'
        description: Thumbnail storage object details
      title:
        description: Variant title
        example: Space Black, 18GB RAM, 512GB SSD
        type: string
      updatedAt:
        description: Timestamp when variant was last updated (RFC3339)
        example: "2026-08-02T16:00:00Z"
        type: string
    type: object
  AttachMediaRequest:
    properties:
      mediaType:
        description: Media classification (image or video)
        example: image
        type: string
      sortOrder:
        description: Presentation sequence position index
        example: 1
        type: integer
      storageObjectId:
        description: Storage object UUID of the uploaded media file
        example: 80000000-0000-0000-0000-000000000001
        type: string
    required:
    - mediaType
    - storageObjectId
    type: object
  BadReqResponse:
    properties:
      code:
        description: Code is the machine-readable error token ("VALIDATION_FAILED").
        example: VALIDATION_FAILED
        type: string
      details:
        description: Details contains individual field-level validation errors.
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        description: Message describes the validation failure summary.
        example: Invalid request input or malformed payload
        type: string
    type: object
  BadRequestErrorResponse:
    properties:
      code:
        description: Code is the machine-readable error token ("VALIDATION_FAILED").
        example: VALIDATION_FAILED
        type: string
      details:
        description: Details contains individual field-level validation errors.
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        description: Message describes the validation failure summary.
        example: Invalid request input or malformed payload
        type: string
    type: object
  Config:
    properties:
      adminNotificationEmail:
        type: string
      allowCards:
        type: boolean
      allowCod:
        description: Payments & taxes (amounts are in major currency units)
        type: boolean
      announcementEnabled:
        type: boolean
      announcementText:
        type: string
      apiKey:
        description: Security & integrations
        type: string
      cartReservationMinutes:
        type: integer
      codFee:
        type: number
      currency:
        type: string
      defaultLocale:
        type: string
      disableCache:
        description: System toggles
        type: boolean
      enableDevOtpBypass:
        type: boolean
      estimatedDeliveryDays:
        type: string
      flatRateShipping:
        description: Shipping & delivery (amounts are in major currency units, e.g.
          EGP)
        type: number
      freeShippingThreshold:
        type: number
      maintenanceMessage:
        type: string
      maintenanceMode:
        description: Maintenance
        type: boolean
      mockEmailNotifications:
        type: boolean
      notifyLowStock:
        type: boolean
      notifyOrderConfirmation:
        description: Notifications
        type: boolean
      notifyOrderShipped:
        type: boolean
      pricesIncludeTax:
        type: boolean
      storeAddress:
        type: string
      storeEmail:
        type: string
      storeName:
        description: Store identity & localization
        type: string
      storePhone:
        type: string
      stripeWebhookSecret:
        type: string
      taxRatePercent:
        type: number
    type: object
  ConflictErrorResponse:
    properties:
      code:
        example: ALREADY_EXISTS
        type: string
      message:
        example: A resource with this identifier or name already exists
        type: string
    type: object
  CreateBrandRequest:
    properties:
      link:
        description: Optional official website URL
        example: https://apple.com
        type: string
      name:
        description: Unique brand/manufacturer name
        example: Apple
        type: string
    required:
    - name
    type: object
  CreateCategoryRequest:
    properties:
      name:
        description: Category name
        example: Laptops
        type: string
      parentId:
        description: Optional UUID of parent category
        example: 40000000-0000-0000-0000-000000000002
        type: string
    required:
    - name
    type: object
  CreateCouponRequest:
    properties:
      code:
        example: SUMMER20
        type: string
      currency:
        example: EGP
        type: string
      discountType:
        example: percentage
        type: string
      discountValue:
        example: 20
        type: integer
      expiresAt:
        example: "2026-08-31T23:59:59Z"
        type: string
      minCartAmount:
        example: 50000
        type: integer
      perUserLimit:
        example: 1
        type: integer
      startsAt:
        example: "2026-06-01T00:00:00Z"
        type: string
      status:
        example: active
        type: string
      usageLimit:
        example: 1000
        type: integer
    required:
    - code
    - discountType
    - discountValue
    type: object
  CreateProductRequest:
    properties:
      brandId:
        description: Optional UUID of the brand/manufacturer
        example: 30000000-0000-0000-0000-000000000001
        type: string
      categoryId:
        description: Required category UUID
        example: 40000000-0000-0000-0000-000000000002
        type: string
      description:
        description: Full product description in markdown or plaintext
        example: Premium over-ear Bluetooth headphones with active noise cancellation.
        type: string
      productType:
        description: 'Product classification: ''simple'' or ''variable'''
        example: simple
        type: string
      slug:
        description: Unique URL-friendly product identifier
        example: wireless-noise-canceling-headphones
        type: string
      title:
        description: Product display title
        example: Wireless Noise-Canceling Headphones
        type: string
      variationAxes:
        description: Ordered attribute keys that define this product's variation theme
          (e.g. ["color","storage"])
        example:
        - color
        - storage
        items:
          type: string
        type: array
    required:
    - categoryId
    - slug
    - title
    type: object
  CreateTagRequest:
    properties:
      name:
        description: Unique tag label name (e.g. Featured, Sale, New Arrival)
        example: Featured
        type: string
    required:
    - name
    type: object
  CreateVariantRequest:
    properties:
      attributes:
        additionalProperties: {}
        description: Key-value attribute specifications (e.g. {"color":"Black","ram":"18GB"})
        type: object
      crossedOutPrice:
        description: Crossed-out/original MSRP price in cents
        example: 299900
        type: integer
      currency:
        description: Currency ISO code
        example: EGP
        type: string
      isDefault:
        description: True if this is the default selected variant on storefronts
        example: true
        type: boolean
      price:
        description: Price in cents (e.g. 249900 = $2499.00)
        example: 249900
        type: integer
      sku:
        description: Optional custom SKU identifier
        example: MAC-PRO-16-BLK-18
        type: string
      thumbnailObjectId:
        description: Storage object UUID for the primary thumbnail
        example: a1b2c3d4-e5f6-7890-1234-56789abcdef0
        type: string
      title:
        description: Variant display title
        example: Space Black, 18GB RAM, 512GB SSD
        type: string
    required:
    - title
    type: object
  CurrencyInfo:
    properties:
      code:
        type: string
      decimals:
        type: integer
      enabled:
        type: boolean
      flag:
        type: string
      isBase:
        type: boolean
      name:
        type: string
      rateToBase:
        type: number
      rateToEGP:
        type: number
      symbol:
        type: string
    type: object
  CursorPage:
    properties:
      hasMore:
        description: HasMore reports whether additional rows exist after this page.
        example: true
        type: boolean
      nextCursor:
        description: NextCursor is the opaque token to fetch the following page, or
          "" when exhausted.
        example: eyJ0IjoiMjAyNC0wMS0wMVQwMDowMDowMFoiLCJpIjoiLi4uIn0
        type: string
      pageSize:
        description: PageSize is the maximum number of items returned per page.
        example: 10
        type: integer
    type: object
  DataResponse:
    properties:
      data:
        description: Data holds the response payload.
    type: object
  FieldError:
    properties:
      constraint:
        description: Constraint is the validation tag or rule that was violated (e.g.,
          "min", "required", "email").
        example: min
        type: string
      field:
        description: Field is the name of the request property that failed validation
          (e.g., "quantity", "email").
        example: quantity
        type: string
      message:
        description: Message is the user-friendly explanation of why the value is
          invalid.
        example: quantity must be at least 1
        type: string
    type: object
  ForbiddenErrorResponse:
    properties:
      code:
        example: FORBIDDEN
        type: string
      message:
        example: You do not have permission to access this resource
        type: string
    type: object
  FulfillmentStatus:
    enum:
    - pending
    - shipped
    - delivered
    type: string
    x-enum-varnames:
    - FulfillmentStatusPending
    - FulfillmentStatusShipped
    - FulfillmentStatusDelivered
  HealthReport:
    properties:
      checkedAt:
        description: CheckedAt is the UTC timestamp at which the probes completed.
        type: string
      services:
        description: Services holds one entry per probed dependency, in a stable order.
        items:
          $ref: '#/definitions/ServiceHealth'
        type: array
      status:
        description: Status is the worst-case rollup across all services.
        type: string
    type: object
  InternalServerErrorResponse:
    properties:
      code:
        example: INTERNAL_ERROR
        type: string
      message:
        example: An unexpected internal server error occurred
        type: string
    type: object
  InventoryLedgerResponse:
    properties:
      createdAt:
        description: Transaction timestamp (RFC3339)
        example: "2026-08-15T12:00:00Z"
        type: string
      id:
        description: Ledger entry record id
        example: 80000000-0000-0000-0000-000000000001
        type: string
      quantity:
        description: Signed quantity adjustment (+/- units)
        example: 50
        type: integer
      reason:
        description: Adjustment reason classification
        example: restock
        type: string
      variantId:
        description: Associated variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
    type: object
  InventoryStockResponse:
    properties:
      availableQuantity:
        description: Salable stock (onHand - reserved)
        example: 50
        type: integer
      isInStock:
        description: True if availableQuantity > 0
        example: true
        type: boolean
      onHandQuantity:
        description: Physical units counted on warehouse shelves
        example: 60
        type: integer
      reservedQuantity:
        description: Units currently reserved in open orders / pending checkouts
        example: 10
        type: integer
      variantId:
        description: Variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
    type: object
  MessageResponse:
    properties:
      message:
        description: Message conveys the completion status or outcome of a mutation.
        example: Operation completed successfully
        type: string
    type: object
  NotFoundErrorResponse:
    properties:
      code:
        example: NOT_FOUND
        type: string
      message:
        example: The requested resource was not found
        type: string
    type: object
  OrderItemResponse:
    properties:
      carrier:
        description: Carrier is the logistics delivery service (e.g. "Aramex", "Bosta").
        type: string
      fulfillmentStatus:
        allOf:
        - $ref: '#/definitions/FulfillmentStatus'
        description: FulfillmentStatus is the seller fulfillment state for this line
          item (pending, shipped, delivered).
      id:
        description: ID is the unique UUID of the order line item.
        type: string
      priceAtPurchase:
        description: PriceAtPurchase is the unit price in minor units (e.g. cents)
          at checkout time.
        type: integer
      productSnapshot:
        description: ProductSnapshot contains immutable JSON metadata captured at
          checkout (e.g. title, SKU, media).
        type: string
      quantity:
        description: Quantity is the number of units purchased.
        type: integer
      shippedAt:
        description: ShippedAt is the RFC3339 timestamp when the seller marked this
          line item as shipped.
        type: string
      trackingNumber:
        description: TrackingNumber is the carrier shipment tracking number for this
          line item.
        type: string
      variantId:
        description: VariantID is the product variant purchased in this line item.
        type: string
    type: object
  OrderMilestone:
    enum:
    - pre_transit
    - picked_at_warehouse
    - arrived_regional_hub
    - arrived_local_depot
    - out_for_delivery
    - delivered
    type: string
    x-enum-varnames:
    - OrderMilestonePreTransit
    - OrderMilestonePickedAtWarehouse
    - OrderMilestoneArrivedRegionalHub
    - OrderMilestoneArrivedLocalDepot
    - OrderMilestoneOutForDelivery
    - OrderMilestoneDelivered
  OrderResponse:
    properties:
      carrier:
        description: Carrier is the shipping carrier (null when not yet shipped/assigned).
        type: string
      codFee:
        description: CODFee is the cash-on-delivery surcharge applied to the order
          in minor currency units.
        type: integer
      couponCode:
        description: CouponCode is the human-readable applied voucher or coupon code.
        type: string
      couponId:
        description: CouponID is the optional applied promotional voucher or coupon
          UUID.
        type: string
      createdAt:
        description: CreatedAt is the RFC3339 creation timestamp.
        type: string
      currency:
        description: Currency is the 3-letter ISO currency code.
        type: string
      customerEmail:
        description: CustomerEmail is the contact email address for transactional
          notifications.
        type: string
      customerId:
        description: CustomerID is the optional authenticated user UUID who placed
          the order.
        type: string
      discountAmount:
        description: DiscountAmount is the deducted amount in minor currency units.
        type: integer
      id:
        description: ID is the unique order UUID.
        type: string
      items:
        description: Items lists the individual line items in this order.
        items:
          $ref: '#/definitions/OrderItemResponse'
        type: array
      milestonePercent:
        description: MilestonePercent is the 0-100 fulfillment percent of Substatus.
        type: integer
      paymentMethod:
        description: PaymentMethod is the payment method used for the order.
        type: string
      shippingAddress:
        allOf:
        - $ref: '#/definitions/AddressResponse'
        description: ShippingAddress is the destination address.
      shippingAmount:
        description: ShippingAmount is the shipping charge applied to the order in
          minor currency units.
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/OrderStatus'
        description: Status is the current state of the order lifecycle.
      statusHistory:
        description: |-
          StatusHistory is the chronological order_status_history audit trail
          (oldest first), empty when no entries exist.
        items:
          $ref: '#/definitions/OrderStatusHistoryResponse'
        type: array
      substatus:
        allOf:
        - $ref: '#/definitions/OrderMilestone'
        description: |-
          Substatus is the granular fulfillment milestone derived from Status
          (see docs/order-milestones.md).
      taxAmount:
        description: TaxAmount is the tax amount applied to the order in minor currency
          units.
        type: integer
      totalAmount:
        description: TotalAmount is the final monetary charge in minor currency units
          after discounts.
        type: integer
      trackingNumber:
