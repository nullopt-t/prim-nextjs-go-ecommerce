basePath: /api/v1
definitions:
  AdjustStockRequest:
    properties:
      quantity:
        description: Adjustment quantity delta (positive to increase, negative to
          decrease)
        example: 50
        type: integer
      reason:
        description: Business audit reason (restock, sale, return, adjustment, reservation_release)
        enum:
        - restock
        - sale
        - return
        - adjustment
        - reservation_release
        example: restock
        type: string
    required:
    - quantity
    - reason
    type: object
  AdminBrandResponse:
    properties:
      createdAt:
        description: Timestamp when brand was created (RFC3339)
        example: "2026-07-01T05:04:38Z"
        type: string
      deletedAt:
        description: Timestamp when brand was soft-deleted, if applicable
        example: "2026-07-01T05:04:38Z"
        type: string
      id:
        description: Internal database ID of the brand
        example: 358b2e03-0b3f-40a4-8163-ebed0cb252ee
        type: string
      link:
        description: Official website URL
        example: https://apple.com
        type: string
      logoUrl:
        description: Publicly accessible URL for the brand logo
        example: https://example.com/apple-logo.png
        type: string
      name:
        description: Brand/manufacturer name
        example: Apple
        type: string
      updatedAt:
        description: Timestamp when brand was last updated (RFC3339)
        example: "2026-07-01T05:04:38Z"
        type: string
    type: object
  AdminCategoryResponse:
    properties:
      createdAt:
        description: Timestamp when category was created (RFC3339)
        example: "2026-06-30T15:47:19Z"
        type: string
      deletedAt:
        description: Timestamp when category was soft-deleted, if applicable
        example: "2026-07-01T10:00:00Z"
        type: string
      id:
        description: Internal database UUID of the category
        example: 40000000-0000-0000-0000-000000000002
        type: string
      name:
        description: Category name
        example: Electronics
        type: string
      parentId:
        description: Optional UUID of the parent category for nested tree hierarchies
        example: 40000000-0000-0000-0000-000000000001
        type: string
      updatedAt:
        description: Timestamp when category was last updated (RFC3339)
        example: "2026-06-30T15:47:19Z"
        type: string
    type: object
  AdminProductDetailsResponse:
    properties:
      brand:
        allOf:
        - $ref: '#/definitions/ProductBrandSummary'
        description: Brand summary
      brandId:
        description: Associated brand ID
        example: 30000000-0000-0000-0000-000000000001
        type: string
      category:
        allOf:
        - $ref: '#/definitions/ProductCategorySummary'
        description: Category summary
      categoryId:
        description: Associated category ID
        example: 40000000-0000-0000-0000-000000000002
        type: string
      createdAt:
        description: Timestamp when product was created (RFC3339)
        example: "2026-08-05T19:00:00Z"
        type: string
      deletedAt:
        description: Timestamp when product was soft-deleted, if applicable
        example: "2026-08-05T19:30:00Z"
        type: string
      description:
        description: Product description
        example: Supercharged by M3 Pro or M3 Max.
        type: string
      highlights:
        description: Bullet highlights
        items:
          type: string
        type: array
      id:
        description: Product database UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      productType:
        description: 'Product classification: simple or variable'
        example: variable
        type: string
      slug:
        description: URL-friendly slug
        example: macbook-pro-16
        type: string
      status:
        allOf:
        - $ref: '#/definitions/PublicationStatus'
        description: 'Publication status: draft, published, archived'
        example: published
      tags:
        description: Product tags
        items:
          $ref: '#/definitions/ProductTagSummary'
        type: array
      thumbnail:
        allOf:
        - $ref: '#/definitions/StorageObjectResponse'
        description: Primary thumbnail storage object
      title:
        description: Product title
        example: MacBook Pro 16"
        type: string
      updatedAt:
        description: Timestamp when product was last updated (RFC3339)
        example: "2026-08-05T19:00:00Z"
        type: string
      variants:
        description: Full administrative variant details
        items:
          $ref: '#/definitions/AdminProductVariantResponse'
        type: array
    type: object
  AdminProductVariantResponse:
    properties:
      attributes:
        additionalProperties: {}
        description: Custom attributes
        type: object
      currency:
        description: Currency ISO code
        example: USD
        type: string
      extractedOriginalPrice:
        description: Numeric original price
        example: 2999
        type: number
      extractedPrice:
        description: Numeric price value
        example: 2499
        type: number
      id:
        description: Variant database UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
      isDefault:
        description: Default variant flag
        example: true
        type: boolean
      media:
        description: Media gallery
        items:
          $ref: '#/definitions/VariantMediaSummary'
        type: array
      originalPrice:
        description: Formatted original price
        example: $2999.00
        type: string
      price:
        description: Formatted display price
        example: $2499.00
        type: string
      sku:
        description: Stock Keeping Unit
        example: MAC-PRO-16-BLK-18
        type: string
      stock:
        allOf:
        - $ref: '#/definitions/AdminStockSummary'
        description: Full administrative inventory breakdown
      thumbnail:
        allOf:
        - $ref: '#/definitions/StorageObjectResponse'
        description: Storage object metadata for thumbnail
      title:
        description: Variant title
        example: Space Black, 18GB RAM, 512GB SSD
        type: string
    type: object
  AdminStockSummary:
    properties:
      availableQuantity:
        description: Salable stock (onHand - reserved)
        example: 50
        type: integer
      isInStock:
        description: True if availableQuantity > 0
        example: true
        type: boolean
      onHandQuantity:
        description: Total physical stock in warehouse
        example: 60
        type: integer
      reservedQuantity:
        description: Stock reserved in active customer orders/checkouts
        example: 10
        type: integer
    type: object
  AdminTagResponse:
    properties:
      createdAt:
        description: Timestamp when tag was created (RFC3339)
        example: "2026-06-30T15:47:19Z"
        type: string
      deletedAt:
        description: Timestamp when tag was soft-deleted, if applicable
        example: "2026-06-30T15:47:19Z"
        type: string
      id:
        description: Unique database UUID identifier of the tag
        example: 50000000-0000-0000-0000-000000000001
        type: string
      name:
        description: Tag label name
        example: Featured
        type: string
      updatedAt:
        description: Timestamp when tag was last updated (RFC3339)
        example: "2026-06-30T15:47:19Z"
        type: string
    type: object
  AdminVariantResponse:
    properties:
      attributes:
        additionalProperties: {}
        description: Custom variant attributes
        type: object
      createdAt:
        description: Timestamp when variant was created (RFC3339)
        example: "2026-08-02T16:00:00Z"
        type: string
      currency:
        description: Currency ISO code
        example: USD
        type: string
      deletedAt:
        description: Timestamp when variant was soft-deleted, if applicable
        example: "2026-08-02T16:15:00Z"
        type: string
      extractedOriginalPrice:
        description: Numeric original price value
        example: 2999
        type: number
      extractedPrice:
        description: Numeric active price value
        example: 2499
        type: number
      id:
        description: Variant database UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
      isDefault:
        description: True if this is the default variant
        example: true
        type: boolean
      media:
        description: Attached gallery media assets
        items:
          $ref: '#/definitions/VariantMediaSummary'
        type: array
      originalPrice:
        description: Formatted original crossed-out price
        example: $2999.00
        type: string
      price:
        description: Formatted active display price
        example: $2499.00
        type: string
      productId:
        description: Parent product UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      sku:
        description: Stock Keeping Unit
        example: MAC-PRO-16-BLK-18
        type: string
      thumbnail:
        allOf:
        - $ref: '#/definitions/StorageObjectResponse'
        description: Thumbnail storage object details
      title:
        description: Variant title
        example: Space Black, 18GB RAM, 512GB SSD
        type: string
      updatedAt:
        description: Timestamp when variant was last updated (RFC3339)
        example: "2026-08-02T16:00:00Z"
        type: string
    type: object
  AttachMediaRequest:
    properties:
      mediaType:
        description: Media classification (image or video)
        example: image
        type: string
      sortOrder:
        description: Presentation sequence position index
        example: 1
        type: integer
      storageObjectId:
        description: Storage object UUID of the uploaded media file
        example: 80000000-0000-0000-0000-000000000001
        type: string
    required:
    - mediaType
    - storageObjectId
    type: object
  BadRequestErrorResponse:
    properties:
      code:
        example: VALIDATION_FAILED
        type: string
      details:
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        example: Invalid request input or malformed payload
        type: string
    type: object
  ConflictErrorResponse:
    properties:
      code:
        example: ALREADY_EXISTS
        type: string
      message:
        example: A resource with this identifier or name already exists
        type: string
    type: object
  CreateBrandRequest:
    properties:
      link:
        description: Optional official website URL
        example: https://apple.com
        type: string
      name:
        description: Unique brand/manufacturer name
        example: Apple
        type: string
    required:
    - name
    type: object
  CreateCategoryRequest:
    properties:
      name:
        description: Category name
        example: Laptops
        type: string
      parentId:
        description: Optional UUID of parent category
        example: 40000000-0000-0000-0000-000000000002
        type: string
    required:
    - name
    type: object
  CreateProductRequest:
    properties:
      brandId:
        description: Optional UUID of the brand/manufacturer
        example: 30000000-0000-0000-0000-000000000001
        type: string
      categoryId:
        description: Required category UUID
        example: 40000000-0000-0000-0000-000000000002
        type: string
      description:
        description: Full product description in markdown or plaintext
        example: Premium over-ear Bluetooth headphones with active noise cancellation.
        type: string
      productType:
        description: 'Product classification: ''simple'' or ''variable'''
        example: simple
        type: string
      slug:
        description: Unique URL-friendly product identifier
        example: wireless-noise-canceling-headphones
        type: string
      title:
        description: Product display title
        example: Wireless Noise-Canceling Headphones
        type: string
    required:
    - categoryId
    - slug
    - title
    type: object
  CreateProductVariantRequest:
    properties:
      attributes:
        additionalProperties: {}
        description: Custom attributes map
        type: object
      crossedOutPrice:
        description: Crossed-out/original MSRP price in cents
        example: 299900
        type: integer
      currency:
        description: Currency ISO code
        example: USD
        type: string
      initialStock:
        description: Initial stock inventory count to credit to warehouse
        example: 50
        type: integer
      isDefault:
        description: Flag if this variant should be the default selection
        example: true
        type: boolean
      price:
        description: Price in cents (e.g. 249900 = $2499.00)
        example: 249900
        type: integer
      title:
        description: Variant option title (e.g. "Space Black / 18GB RAM")
        example: Space Black / 18GB RAM / 512GB SSD
        type: string
    required:
    - title
    type: object
  CreateTagRequest:
    properties:
      name:
        description: Unique tag label name (e.g. Featured, Sale, New Arrival)
        example: Featured
        type: string
    required:
    - name
    type: object
  CreateVariantRequest:
    properties:
      attributes:
        additionalProperties: {}
        description: Key-value attribute specifications (e.g. {"color":"Black","ram":"18GB"})
        type: object
      crossedOutPrice:
        description: Crossed-out/original MSRP price in cents
        example: 299900
        type: integer
      currency:
        description: Currency ISO code
        example: USD
        type: string
      isDefault:
        description: True if this is the default selected variant on storefronts
        example: true
        type: boolean
      price:
        description: Price in cents (e.g. 249900 = $2499.00)
        example: 249900
        type: integer
      sku:
        description: Optional custom SKU identifier
        example: MAC-PRO-16-BLK-18
        type: string
      thumbnailObjectId:
        description: Storage object UUID for the primary thumbnail
        example: a1b2c3d4-e5f6-7890-1234-56789abcdef0
        type: string
      title:
        description: Variant display title
        example: Space Black, 18GB RAM, 512GB SSD
        type: string
    required:
    - title
    type: object
  DataResponse:
    properties:
      data: {}
    type: object
  FieldError:
    properties:
      constraint:
        example: min
        type: string
      field:
        example: quantity
        type: string
      message:
        example: quantity must be at least 1
        type: string
    type: object
  ForbiddenErrorResponse:
    properties:
      code:
        example: FORBIDDEN
        type: string
      message:
        example: You do not have permission to access this resource
        type: string
    type: object
  InternalServerErrorResponse:
    properties:
      code:
        example: INTERNAL_ERROR
        type: string
      message:
        example: An unexpected internal server error occurred
        type: string
    type: object
  InventoryLedgerResponse:
    properties:
      createdAt:
        description: Transaction timestamp (RFC3339)
        example: "2026-08-15T12:00:00Z"
        type: string
      id:
        description: Ledger entry record UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      quantity:
        description: Signed quantity adjustment (+/- units)
        example: 50
        type: integer
      reason:
        description: Adjustment reason classification
        example: restock
        type: string
      variantId:
        description: Associated variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
    type: object
  InventoryStockResponse:
    properties:
      availableQuantity:
        description: Salable stock (onHand - reserved)
        example: 50
        type: integer
      isInStock:
        description: True if availableQuantity > 0
        example: true
        type: boolean
      onHandQuantity:
        description: Physical units counted on warehouse shelves
        example: 60
        type: integer
      reservedQuantity:
        description: Units currently reserved in open orders / pending checkouts
        example: 10
        type: integer
      variantId:
        description: Variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
    type: object
  MessageResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
    type: object
  NotFoundErrorResponse:
    properties:
      code:
        example: NOT_FOUND
        type: string
      message:
        example: The requested resource was not found
        type: string
    type: object
  Object:
    properties:
      bucket:
        description: Bucket is the target S3/MinIO bucket name.
        type: string
      contentType:
        description: ContentType is the MIME type (e.g. "image/webp", "application/pdf").
        type: string
      createdAt:
        description: CreatedAt is the timestamp when the object record was created.
        type: string
      deletedAt:
        description: DeletedAt is the optional soft-delete timestamp.
        type: string
      fileSize:
        description: FileSize is the file length in bytes.
        format: int64
        type: integer
      id:
        description: ID is the unique database UUID for the storage object.
        type: string
      key:
        description: Key is the object path key inside the bucket (e.g. "products/uuid/image.webp").
        type: string
      publicURL:
        description: PublicURL is the publicly accessible CDN or presigned HTTP endpoint
          for the file.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/ObjectStatus'
        description: Status is the current storage lifecycle state.
      updatedAt:
        description: UpdatedAt is the timestamp when metadata was last modified.
        type: string
    type: object
  ObjectStatus:
    enum:
    - uploading
    - uploaded
    - deleting
    - deleted
    type: string
    x-enum-varnames:
    - ObjectStatusUploading
    - ObjectStatusUploaded
    - ObjectStatusDeleting
    - ObjectStatusDeleted
  OrderStatus:
    enum:
    - pending
    - paid
    - processing
    - shipped
    - delivered
    - canceled
    - refunded
    type: string
    x-enum-varnames:
    - OrderStatusPending
    - OrderStatusPaid
    - OrderStatusProcessing
    - OrderStatusShipped
    - OrderStatusDelivered
    - OrderStatusCanceled
    - OrderStatusRefunded
  Page:
    properties:
      hasNext:
        example: true
        type: boolean
      hasPrevious:
        example: false
        type: boolean
      page:
        example: 1
        type: integer
      pageSize:
        example: 10
        type: integer
      totalItems:
        example: 20
        type: integer
      totalPages:
        example: 2
        type: integer
    type: object
  PaginatedResponse:
    properties:
      data: {}
      meta: {}
    type: object
  Product:
    properties:
      brand:
        allOf:
        - $ref: '#/definitions/ProductBrand'
        description: Brand is the hydrated ProductBrand entity (not stored directly
          in the products table).
      brandID:
        description: BrandID is the optional UUID of the product's manufacturer/brand.
        type: string
      category:
        allOf:
        - $ref: '#/definitions/ProductCategory'
        description: Category is the hydrated ProductCategory entity (not stored directly
          in the products table).
      categoryID:
        description: CategoryID is the required taxonomy category UUID.
        type: string
      createdAt:
        description: CreatedAt is the timestamp when the product was added to the
          catalog.
        type: string
      deletedAt:
        description: DeletedAt is the optional soft-delete timestamp.
        type: string
      description:
        description: Description is the full product narrative copy.
        type: string
      highlights:
        description: Highlights contains key bullet points displayed on product detail
          pages.
        items:
          type: string
        type: array
      id:
        description: ID is the unique database UUID for the product.
        type: string
      productType:
        allOf:
        - $ref: '#/definitions/ProductType'
        description: ProductType indicates simple or variable catalog classification.
      slug:
        description: Slug is the URL-friendly unique SEO identifier.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/PublicationStatus'
        description: Status is the draft/published/archived lifecycle state.
      thumbnail:
        allOf:
        - $ref: '#/definitions/Object'
        description: Thumbnail is the hydrated Object entity for the cover image (not
          stored directly in the products table).
      thumbnailObjectID:
        description: ThumbnailObjectID is the optional storage object UUID for the
          primary cover image.
        type: string
      title:
        description: Title is the primary product display name.
        type: string
      updatedAt:
        description: UpdatedAt is the timestamp when product metadata was last modified.
        type: string
    type: object
  ProductBrand:
    properties:
      createdAt:
        description: CreatedAt is the timestamp when the brand record was created.
        type: string
      deletedAt:
        description: DeletedAt is the optional soft-delete timestamp.
        type: string
      id:
        description: ID is the internal database UUID.
        type: string
      link:
        description: Link is the optional official website URL.
        type: string
      logoObjectID:
        description: LogoObjectID is the optional storage object UUID for the brand
          logo.
        type: string
      logoURL:
        description: LogoURL is the resolved public CDN URL for the brand logo image.
        type: string
      name:
        description: Name is the unique brand name (e.g. "Apple", "Nike").
        type: string
      updatedAt:
        description: UpdatedAt is the timestamp when brand details were last modified.
        type: string
    type: object
  ProductBrandSummary:
    properties:
      link:
        description: Official website URL
        example: https://apple.com
        type: string
      logoUrl:
        description: Publicly accessible URL for the brand logo
        example: https://example.com/apple-logo.png
        type: string
      name:
        description: Brand name
        example: Apple
        type: string
    type: object
  ProductCategory:
    properties:
      createdAt:
        description: CreatedAt is the timestamp when the category was created.
        type: string
      deletedAt:
        description: DeletedAt is the optional soft-delete timestamp.
        type: string
      id:
        description: ID is the unique internal database UUID.
        type: string
      name:
        description: Name is the category display name (e.g. "Electronics", "Laptops").
        type: string
      parentID:
        description: ParentID is the optional UUID of the parent category (nil for
          root categories).
        type: string
      updatedAt:
        description: UpdatedAt is the timestamp when category details were last modified.
        type: string
    type: object
  ProductCategorySummary:
    properties:
      id:
        description: Category UUID
        example: 40000000-0000-0000-0000-000000000002
        type: string
      name:
        description: Category name
        example: Electronics
        type: string
    type: object
  ProductTagSummary:
    properties:
      id:
        description: Tag UUID
        example: 50000000-0000-0000-0000-000000000001
        type: string
      name:
        description: Tag name
        example: Featured
        type: string
    type: object
  ProductType:
    enum:
    - simple
    - variable
    type: string
    x-enum-varnames:
    - ProductTypeSimple
    - ProductTypeVariable
  PublicationStatus:
    enum:
    - draft
    - published
    - archived
    type: string
    x-enum-varnames:
    - PublicationStatusDraft
    - PublicationStatusPublished
    - PublicationStatusArchived
  PutProductCategoryRequest:
    properties:
      categoryId:
        description: Target category UUID
        example: 40000000-0000-0000-0000-000000000002
        type: string
    required:
    - categoryId
    type: object
  PutProductTagsRequest:
    properties:
      tagIds:
        description: List of Tag UUIDs to associate with the product
        example:
        - '[''50000000-0000-0000-0000-000000000001'']'
        items:
          type: string
        type: array
    required:
    - tagIds
    type: object
  ReorderMediaRequest:
    properties:
      orderedMediaIds:
        description: Array of media UUIDs in desired presentation sequence
        example:
        - '[''80000000-0000-0000-0000-000000000001'']'
        items:
          type: string
        type: array
    required:
    - orderedMediaIds
    type: object
  ReviewResponse:
    properties:
      body:
        description: Review detailed text
        example: The M3 Pro chip handles heavy 4K rendering and compiles code effortlessly.
        type: string
      createdAt:
        description: Submission timestamp (RFC3339)
        example: "2026-08-13T07:56:17Z"
        type: string
      id:
        description: Review UUID
        example: 92000000-0000-0000-0000-000000000001
        type: string
      orderItemId:
        description: Verified Order Item purchase UUID
        example: 91000000-0000-0000-0000-000000000001
        type: string
      productId:
        description: Reviewed Product UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      rating:
        description: Star score (1-5)
        example: 5
        type: integer
      status:
        description: 'Moderation status: pending, approved, rejected'
        example: approved
        type: string
      title:
        description: Optional review headline
        example: Unbelievable performance!
        type: string
      updatedAt:
        description: Last updated timestamp (RFC3339)
        example: "2026-08-13T07:56:17Z"
        type: string
      userId:
        description: Author Customer UUID
        example: 10000000-0000-0000-0000-000000000002
        type: string
    type: object
  SetDefaultVariantRequest:
    properties:
      variantId:
        description: Variant UUID to set as default
        example: 70000000-0000-0000-0000-000000000001
        type: string
    required:
    - variantId
    type: object
  Sort:
    properties:
      field:
        example: name
        type: string
      order:
        allOf:
        - $ref: '#/definitions/SortOrder'
        example: asc
    type: object
  SortOrder:
    enum:
    - asc
    - desc
    type: string
    x-enum-varnames:
    - SortAsc
    - SortDesc
  StorageObjectResponse:
    properties:
      bucket:
        description: Storage bucket name
        example: product-media
        type: string
      contentType:
        description: MIME content type
        example: image/webp
        type: string
      fileSize:
        description: File size in bytes
        example: 1048576
        type: integer
      id:
        description: Internal object storage UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      key:
        description: Storage object key / filepath
        example: variants/70000000/image.webp
        type: string
      publicUrl:
        description: Public CDN URL
        example: https://example.com/media/image.webp
        type: string
    type: object
  UnauthorizedErrorResponse:
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      message:
        example: Authentication token is missing or expired
        type: string
    type: object
  UpdateBrandRequest:
    properties:
      link:
        description: Updated official website URL
        example: https://apple.com
        type: string
      logoObjectId:
        description: Object storage UUID of the brand logo
        example: 358b2e03-0b3f-40a4-8163-ebed0cb252ee
        type: string
      name:
        description: Updated brand name
        example: Apple Inc.
        type: string
    type: object
  UpdateCategoryRequest:
    properties:
      name:
        description: Updated category name
        example: Gaming Laptops
        type: string
      parentId:
        description: Updated parent category UUID
        example: 40000000-0000-0000-0000-000000000002
        type: string
    type: object
  UpdateOrderStatusRequest:
    properties:
      notes:
        type: string
      status:
        $ref: '#/definitions/OrderStatus'
    required:
    - status
    type: object
  UpdateProductRequest:
    properties:
      brandId:
        description: Optional updated brand UUID
        example: 30000000-0000-0000-0000-000000000001
        type: string
      categoryId:
        description: Optional updated category UUID
        example: 40000000-0000-0000-0000-000000000002
        type: string
      description:
        description: Updated product description
        example: Updated description with enhanced specs.
        type: string
      highlights:
        description: Key product highlight bullet points
        example:
        - '[''Active Noise Cancellation'''
        - '''Up to 30h battery'']'
        items:
          type: string
        type: array
      productType:
        description: 'Product type classification: ''simple'' or ''variable'''
        example: simple
        type: string
      title:
        description: Updated product title
        example: Wireless Noise-Canceling Headphones Pro
        type: string
    type: object
  UpdateReviewStatusRequest:
    properties:
      status:
        description: 'Moderation state: pending, approved, rejected'
        enum:
        - pending
        - approved
        - rejected
        example: approved
        type: string
    required:
    - status
    type: object
  UpdateTagRequest:
    properties:
      name:
        description: Updated tag label name
        example: Best Seller
        type: string
    type: object
  UpdateVariantRequest:
    properties:
      attributes:
        additionalProperties: {}
        description: Updated attributes map
        type: object
      crossedOutPrice:
        description: Updated original price in cents
        example: 299900
        type: integer
      currency:
        description: Currency ISO code
        example: USD
        type: string
      isDefault:
        description: Updated default selection flag
        example: true
        type: boolean
      price:
        description: Updated price in cents
        example: 249900
        type: integer
      sku:
        description: Updated SKU identifier
        example: MAC-PRO-16-BLK-18
        type: string
      thumbnailObjectId:
        description: Updated thumbnail storage object UUID
        example: a1b2c3d4-e5f6-7890-1234-56789abcdef0
        type: string
      title:
        description: Updated variant display title
        example: Space Black, 18GB RAM, 512GB SSD
        type: string
    type: object
  VariantMediaResponse:
    properties:
      id:
        description: Media record UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      mediaType:
        description: Media classification (image or video)
        example: image
        type: string
      object:
        allOf:
        - $ref: '#/definitions/StorageObjectResponse'
        description: Detailed storage file metadata
      objectId:
        description: Underlying storage object UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      sortOrder:
        description: Display sequence sort order
        example: 1
        type: integer
      variantId:
        description: Associated variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
    type: object
  VariantMediaSummary:
    properties:
      id:
        description: Media record UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      mediaType:
        description: Media MIME type or format (e.g. image/jpeg, video/mp4)
        example: image/jpeg
        type: string
      sortOrder:
        description: Display sequence sort order
        example: 1
        type: integer
      url:
        description: Public CDN or storage URL
        example: https://example.com/media/headphones.jpg
        type: string
    type: object
  VariantResponse:
    properties:
      attributes:
        additionalProperties: {}
        description: Custom variant attributes
        type: object
      currency:
        description: Currency ISO code
        example: USD
        type: string
      extractedOriginalPrice:
        description: Numeric original price value
        example: 2999
        type: number
      extractedPrice:
        description: Numeric active price value
        example: 2499
        type: number
      id:
        description: Variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
      isDefault:
        description: True if this is the default variant
        example: true
        type: boolean
      media:
        description: Attached gallery media assets
        items:
          $ref: '#/definitions/VariantMediaSummary'
        type: array
      originalPrice:
        description: Formatted original crossed-out price
        example: $2999.00
        type: string
      price:
        description: Formatted active display price
        example: $2499.00
        type: string
      productId:
        description: Parent product UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      sku:
        description: Stock Keeping Unit
        example: MAC-PRO-16-BLK-18
        type: string
      thumbnail:
        description: Primary thumbnail image URL
        example: https://example.com/thumb.jpg
        type: string
      title:
        description: Variant title
        example: Space Black, 18GB RAM, 512GB SSD
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
  description: This is the Prim API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Prim API
  version: "1.0"
paths:
  /admin/brands:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of all product brands including soft-deleted
        records for administrator management.
      parameters:
      - example: 1
        in: query
        name: page
        type: integer
      - example: 10
        in: query
        name: pageSize
        type: integer
      - example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of all brands including deleted
          schema:
            allOf:
            - $ref: '#/definitions/PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/AdminBrandResponse'
                  type: array
                meta:
                  $ref: '#/definitions/Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: List all brands including soft-deleted ones (Admin)
      tags:
      - Admin Brands
    post:
      consumes:
      - application/json
      description: Adds a new product manufacturer/brand to the store catalog. Brand
        names must be unique.
      parameters:
      - description: Brand details (name and optional external website link)
        in: body
        name: brand
        required: true
        schema:
          $ref: '#/definitions/CreateBrandRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created brand details
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/AdminBrandResponse'
              type: object
        "400":
          description: Validation error or missing brand name
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "409":
          description: A brand with this name already exists
          schema:
            $ref: '#/definitions/ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Create a product brand
      tags:
      - Admin Brands
  /admin/brands/{id}:
    delete:
      consumes:
      - application/json
      description: Marks an active brand as soft-deleted (`deleted_at = NOW()`), removing
        it from active listings.
      parameters:
      - description: Brand UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Brand soft-deleted successfully
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Brand not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Soft-delete a brand
      tags:
      - Admin Brands
    get:
      consumes:
      - application/json
      description: Retrieves active product brand details by its UUID.
      parameters:
      - description: Brand UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Brand details
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/AdminBrandResponse'
              type: object
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Brand not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Get brand details by ID
      tags:
      - Admin Brands
    patch:
      consumes:
      - application/json
      description: Updates specific fields of an existing brand such as name, website
        link, or logo object reference.
      parameters:
      - description: Brand UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (name, link, logo_id)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/UpdateBrandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Update confirmation message
          schema:
            $ref: '#/definitions/MessageResponse'
        "400":
          description: Validation error or referenced logo object not found
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Brand not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "409":
          description: A brand with updated name already exists
          schema:
            $ref: '#/definitions/ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Update brand details
      tags:
      - Admin Brands
  /admin/brands/{id}/logo:
    put:
      consumes:
      - multipart/form-data
      description: Uploads an image file to be used as the brand's logo
      parameters:
      - description: Brand UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Logo image file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Upload confirmation message
          schema:
            $ref: '#/definitions/MessageResponse'
        "400":
          description: Invalid UUID format or missing file
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Upload brand logo
      tags:
      - Admin Brands
  /admin/categories:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of all product categories including soft-deleted
        records for administrator taxonomy management.
      parameters:
      - example: 1
        in: query
        name: page
        type: integer
      - example: 10
        in: query
        name: pageSize
        type: integer
      - example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of all categories including deleted
          schema:
            allOf:
            - $ref: '#/definitions/PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/AdminCategoryResponse'
                  type: array
                meta:
                  $ref: '#/definitions/Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: List all categories including soft-deleted ones (Admin)
      tags:
      - Admin Categories
    post:
      consumes:
      - application/json
      description: Creates a new product category in the taxonomy tree. Can optionally
        be assigned a parent category ID for hierarchical nesting.
      parameters:
      - description: Category name and optional parent category UUID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created category details
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/AdminCategoryResponse'
              type: object
        "400":
          description: Validation error or referenced parent category does not exist
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "409":
          description: A category with this name already exists
          schema:
            $ref: '#/definitions/ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Create a product category
      tags:
      - Admin Categories
  /admin/categories/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves product category details by its UUID.
      parameters:
      - description: Category UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Category details
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/AdminCategoryResponse'
              type: object
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Get category details by ID
      tags:
      - Admin Categories
    patch:
      consumes:
      - application/json
      description: Updates specific fields of an existing category (name or parent
        category ID). Guards against self-referencing and circular tree dependencies.
      parameters:
      - description: Category UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (name, parent_id)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated category details
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/AdminCategoryResponse'
              type: object
        "400":
          description: Validation error, circular hierarchy, or parent not found
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "409":
          description: A category with updated name already exists
          schema:
            $ref: '#/definitions/ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Update category details
      tags:
      - Admin Categories
  /admin/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Updates the status of an existing order.
      parameters:
      - description: Order UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Status update details
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Status update confirmation
          schema:
            $ref: '#/definitions/MessageResponse'
        "400":
          description: Validation error or invalid UUID format
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Update order status (Admin)
      tags:
      - Admin Orders
  /admin/products:
    get:
      description: Returns a paginated list of all products including draft, published,
        archived, and soft-deleted records for administrator catalog management.
      parameters:
      - collectionFormat: csv
        in: query
        items:
          type: string
        name: '-'
        type: array
      - description: Optional brand name(s) or UUID(s) (comma-separated, e.g. "apple,sony")
        example: apple,sony
        in: query
        name: brand
        type: string
      - description: Optional category name(s) or UUID(s) (comma-separated, e.g. "laptops,audio")
        example: laptops,audio
        in: query
        name: category
        type: string
      - example: 1
        in: query
        name: page
        type: integer
      - example: 10
        in: query
        name: pageSize
        type: integer
      - example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      - description: Optional tag name(s) or UUID(s) (comma-separated, e.g. "featured,sale")
        example: featured,sale
        in: query
        name: tag
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of all products including deleted
          schema:
            allOf:
            - $ref: '#/definitions/PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/Product'
                  type: array
                meta:
                  $ref: '#/definitions/Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: List all products for management (Admin)
      tags:
      - Admin Products
    post:
      consumes:
      - application/json
      description: Creates a new product in 'draft' status. Products remain in draft
        state until at least one variant is created and the product is explicitly
        published.
      parameters:
      - description: Product title, description, category ID, optional brand ID and
          highlights
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created draft product details
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/AdminProductDetailsResponse'
              type: object
        "400":
          description: Validation error or invalid UUID reference
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "409":
          description: Product with generated public ID already exists
          schema:
            $ref: '#/definitions/ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Create a new draft product
      tags:
      - Admin Products
  /admin/products/{id}:
    delete:
      description: Marks a product as soft-deleted (`deleted_at = NOW()`), removing
        it from active administrative and customer listings.
      parameters:
      - description: Product UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Product soft-deleted successfully
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Soft-delete a product
      tags:
      - Admin Products
    get:
      description: Retrieves full product details by its unique internal UUID.
      parameters:
      - description: Internal Product UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Product details
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/AdminProductDetailsResponse'
              type: object
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Get product by internal UUID
      tags:
      - Admin Products
    patch:
      consumes:
      - application/json
      description: Updates specific fields of an existing product such as title, description,
        category, brand, or publication status.
      parameters:
      - description: Product UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (title, description, brand_id, category_id,
          status, highlights)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated product details
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/AdminProductDetailsResponse'
              type: object
        "400":
          description: Validation error or invalid UUID format
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Product, brand, or category not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Update product attributes
      tags:
      - Admin Products
  /admin/products/{id}/archive:
    post:
      description: Transitions a product status to 'archived', hiding it from public
        store front listings while retaining all historical sales and inventory data.
      parameters:
      - description: Product UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Archival confirmation message
          schema:
            $ref: '#/definitions/MessageResponse'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Archive a product
      tags:
      - Admin Products
  /admin/products/{id}/categories:
    put:
      consumes:
      - application/json
      parameters:
      - description: Product ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Category ID to assign
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/PutProductCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: update the category of a product
      tags:
      - Admin Products
  /admin/products/{id}/publish:
