paths:
  /admin/attributes/{id}:
    patch:
      consumes:
      - application/json
      description: Patches an existing category attribute (label, value type, allowed
        values, filterability or order).
      parameters:
      - description: Attribute UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/UpdateAttributeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Update confirmation message
          schema:
            $ref: '#/definitions/MessageResponse'
        "400":
          description: Invalid attribute ID or request body
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Attribute not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Update an attribute
      tags:
      - Admin Attributes
  /admin/audit:
    get:
      consumes:
      - application/json
      description: Returns a filterable, keyset-paginated view of privileged admin
        mutations (superadmin only).
      parameters:
      - description: Filter by actor user UUID
        in: query
        name: actorId
        type: string
      - description: Filter by action name (e.g. user.role.update)
        in: query
        name: action
        type: string
      - description: Filter by entity type (e.g. user)
        in: query
        name: entityType
        type: string
      - description: Filter by entity id
        in: query
        name: entityId
        type: string
      - description: Only entries at/after this RFC3339 timestamp
        in: query
        name: from
        type: string
      - description: Only entries at/before this RFC3339 timestamp
        in: query
        name: to
        type: string
      - description: Opaque pagination cursor
        in: query
        name: cursor
        type: string
      - description: Page size (default 50, max 100)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Audit trail
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
