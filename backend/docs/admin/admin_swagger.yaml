          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: List reviews (Admin)
      tags:
      - Admin Reviews
  /admin/reviews/{id}:
    delete:
      description: Permanently deletes a review.
      parameters:
      - description: Review ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Review deleted successfully
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Invalid review ID
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Review not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Delete review (Admin)
      tags:
      - Admin Reviews
    get:
      description: Retrieves full details of a review for moderation.
      parameters:
      - description: Review ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Review details
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/review.ReviewResponse'
              type: object
        "400":
          description: Invalid review ID
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Review not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Get review details (Admin)
      tags:
      - Admin Reviews
  /admin/reviews/{id}/status:
    patch:
      consumes:
      - application/json
      description: Updates a review's moderation status (pending, approved, rejected).
      parameters:
      - description: Review ID
        in: path
        name: id
        required: true
        type: string
      - description: New status payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/review.UpdateReviewStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Status updated successfully
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Invalid input or status
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Review not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Moderate review status (Admin)
      tags:
      - Admin Reviews
  /admin/tags:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of all product tags including soft-deleted
        records for administrator management.
      parameters:
      - example: 1
        in: query
        name: page
        type: integer
      - example: 10
        in: query
        name: pageSize
        type: integer
      - example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of all tags including deleted
          schema:
            allOf:
            - $ref: '#/definitions/api.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/tag.AdminTagResponse'
                  type: array
                meta:
                  $ref: '#/definitions/pagination.Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: List all tags including soft-deleted ones (Admin)
      tags:
      - Admin Tags
    post:
      consumes:
      - application/json
      description: Adds a new product classification tag (e.g. 'black-friday', 'best-seller').
        Tag names must be unique.
      parameters:
      - description: Tag name payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/tag.CreateTagRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created tag details
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/tag.AdminTagResponse'
              type: object
        "400":
          description: Validation error or missing tag name
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "409":
          description: A tag with this name already exists
          schema:
            $ref: '#/definitions/api.ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Create a product tag
      tags:
      - Admin Tags
  /admin/tags/{id}:
    delete:
      consumes:
      - application/json
      description: Marks an active product tag as soft-deleted (`deleted_at = NOW()`),
        removing it from tag selections.
      parameters:
      - description: Tag UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deletion confirmation message
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Tag not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Soft-delete a tag
      tags:
      - Admin Tags
    get:
      consumes:
      - application/json
      description: Retrieves active product tag details by its UUID.
      parameters:
      - description: Tag UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Tag details
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/tag.AdminTagResponse'
              type: object
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Tag not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Get tag details by ID
      tags:
      - Admin Tags
    patch:
      consumes:
      - application/json
      description: Updates the name of an existing product tag. Tag names must be
        unique.
      parameters:
      - description: Tag UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (name)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/tag.UpdateTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Update confirmation message
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Validation error or invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Tag not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "409":
          description: A tag with updated name already exists
          schema:
            $ref: '#/definitions/api.ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Update tag details
      tags:
      - Admin Tags
  /admin/variants/{id}:
    delete:
      description: Marks an active product variant as soft-deleted (`deleted_at =
        NOW()`), removing it from active product options.
      parameters:
      - description: Variant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Deletion confirmation
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Variant not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Soft-delete a product variant
      tags:
      - Admin Product Variants
    patch:
      consumes:
      - application/json
      description: Updates specific fields of an existing variant such as SKU, title,
        price, crossed-out price, currency, attributes, or default status.
      parameters:
      - description: Variant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (sku, title, price, crossed_out_price, currency,
          attributes, is_default)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/variant.UpdateVariantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Update confirmation message
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Validation error or invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Variant not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "409":
          description: SKU already in use
          schema:
            $ref: '#/definitions/api.ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Update product variant attributes
      tags:
      - Admin Product Variants
  /admin/variants/{id}/inventory:
    get:
      description: Retrieves on-hand, reserved, available quantities and in-stock
        status for a variant.
      parameters:
      - description: Variant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Variant stock summary
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/variant.InventoryStockResponse'
              type: object
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Get detailed stock levels for a variant (Admin)
      tags:
      - Admin Variant Inventory
  /admin/variants/{id}/inventory/adjust:
    post:
      consumes:
      - application/json
      description: Records a new inventory ledger transaction (restock, adjustment,
        sale, return) to increment or decrement the variant's stock.
      parameters:
      - description: Variant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Stock adjustment details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/variant.AdjustStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated stock levels
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/variant.InventoryStockResponse'
              type: object
        "400":
          description: Validation error or insufficient inventory
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Variant not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Adjust variant inventory stock
      tags:
      - Admin Variant Inventory
  /admin/variants/{id}/inventory/ledgers:
    get:
      description: Returns a paginated list of inventory audit ledger transactions
        for a specific variant.
      parameters:
      - description: Variant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - example: 1
        in: query
        name: page
        type: integer
      - example: 10
        in: query
        name: pageSize
        type: integer
      - example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated inventory audit history
          schema:
            allOf:
            - $ref: '#/definitions/api.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/variant.InventoryLedgerResponse'
                  type: array
                meta:
                  $ref: '#/definitions/pagination.Page'
              type: object
        "400":
          description: Invalid query parameters or UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: List inventory audit ledgers for a variant
      tags:
      - Admin Variant Inventory
  /admin/variants/{id}/media:
    post:
      consumes:
      - application/json
      description: Links an uploaded storage object (image/video) to a specific product
        variant with media type and sort order.
      parameters:
      - description: Variant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Storage object ID, media type, and sort order
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/variant.AttachMediaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Attached variant media details
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/variant.VariantMediaResponse'
              type: object
        "400":
          description: Validation error or invalid UUID reference
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "409":
          description: Storage object is already attached to this variant
          schema:
            $ref: '#/definitions/api.ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Attach a storage object to a variant
      tags:
      - Admin Variant Media
  /admin/variants/{id}/media/{media_id}:
    delete:
      description: Removes a media attachment relationship from a variant.
      parameters:
      - description: Variant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Media Attachment UUID
        format: uuid
        in: path
        name: media_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detachment confirmation message
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Media relationship not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Remove a media attachment from a variant
      tags:
      - Admin Variant Media
  /admin/variants/{id}/media/reorder:
    patch:
      consumes:
      - application/json
      description: Reorders attached media items for a variant according to the specified
        array of media IDs.
      parameters:
      - description: Variant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Ordered list of media UUIDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/variant.ReorderMediaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reorder confirmation message
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Invalid UUID format or empty list
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Batch reorder media items for a variant
      tags:
      - Admin Variant Media
  /admin/variants/{id}/restore:
    post:
      description: Restores a soft-deleted product variant back to active status (`deleted_at
        = NULL`).
      parameters:
      - description: Variant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Restore confirmation message
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Variant not found or not deleted
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Restore a soft-deleted product variant
      tags:
      - Admin Product Variants
security:
- BearerAuth: []
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
