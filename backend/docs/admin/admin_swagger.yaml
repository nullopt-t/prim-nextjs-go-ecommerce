  /admin/tags:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of all product tags including soft-deleted
        records for administrator management.
      parameters:
      - description: |-
          Cursor is an opaque keyset token. When present, repositories should use
          keyset pagination instead of OFFSET.
        example: eyJ0IjoiLi4uIiwiaSI6Ii4uLiJ9
        in: query
        name: cursor
        type: string
      - description: |-
          KeysetMode explicitly requests keyset pagination even when no cursor has
          been supplied yet (i.e. for the very first page). Endpoints that still
          serve classic OFFSET pagination use this to opt in per request.
        example: true
        in: query
        name: keyset
        type: boolean
      - description: Page is the requested 1-based page number from query parameters.
        example: 1
        in: query
        name: page
        type: integer
      - description: PageSize is the requested number of items per page.
        example: 10
        in: query
        name: pageSize
        type: integer
      - description: Search is an optional free-text search query string.
        example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        description: RawSort contains the raw sort query strings (e.g. ["name,-created_at"]).
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of all tags including deleted
          schema:
            allOf:
            - $ref: '#/definitions/PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/AdminTagResponse'
                  type: array
                meta:
                  $ref: '#/definitions/Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: List all tags including soft-deleted ones (Admin)
      tags:
      - Admin Tags
    post:
      consumes:
      - application/json
      description: Adds a new product classification tag (e.g. 'black-friday', 'best-seller').
        Tag names must be unique.
      parameters:
      - description: Tag name payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/CreateTagRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created tag details
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/AdminTagResponse'
              type: object
        "400":
          description: Validation error or missing tag name
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "409":
          description: A tag with this name already exists
          schema:
            $ref: '#/definitions/ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Create a product tag
      tags:
      - Admin Tags
  /admin/tags/{id}:
    delete:
      consumes:
      - application/json
      description: Marks an active product tag as soft-deleted (`deleted_at = NOW()`),
