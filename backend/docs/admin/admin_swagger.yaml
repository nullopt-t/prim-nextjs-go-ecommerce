host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
  description: This is the Prim API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Prim API
  version: "1.0"
paths:
  /admin/brands:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of all product brands including soft-deleted
        records for administrator management.
      parameters:
      - example: 1
        in: query
        name: page
        type: integer
      - example: 10
        in: query
        name: pageSize
        type: integer
      - example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of all brands including deleted
          schema:
            allOf:
            - $ref: '#/definitions/api.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/brand.AdminBrandResponse'
                  type: array
                meta:
                  $ref: '#/definitions/pagination.Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: List all brands including soft-deleted ones (Admin)
      tags:
      - Admin Brands
    post:
      consumes:
      - application/json
      description: Adds a new product manufacturer/brand to the store catalog. Brand
        names must be unique.
      parameters:
      - description: Brand details (name and optional external website link)
        in: body
        name: brand
        required: true
        schema:
          $ref: '#/definitions/brand.CreateBrandRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created brand details
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/brand.AdminBrandResponse'
              type: object
        "400":
          description: Validation error or missing brand name
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "409":
          description: A brand with this name already exists
          schema:
            $ref: '#/definitions/api.ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Create a product brand
      tags:
      - Admin Brands
  /admin/brands/{id}:
    delete:
      consumes:
      - application/json
      description: Marks an active brand as soft-deleted (`deleted_at = NOW()`), removing
        it from active listings.
