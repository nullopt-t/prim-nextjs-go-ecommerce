host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
  description: This is the Prim API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Prim API
  version: "1.0"
paths:
  /admin/brands:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of all product brands including soft-deleted
        records for administrator management.
      parameters:
      - example: 1
        in: query
        name: page
        type: integer
      - example: 10
        in: query
        name: pageSize
        type: integer
      - example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of all brands including deleted
          schema:
            allOf:
            - $ref: '#/definitions/PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/AdminBrandResponse'
                  type: array
                meta:
                  $ref: '#/definitions/Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "500":
