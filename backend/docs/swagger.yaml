  title: Prim API
  version: "1.0"
paths:
  /admin/brands:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of all product brands including soft-deleted
        records for administrator management.
      parameters:
      - example: 1
        in: query
        name: page
        type: integer
      - example: 10
        in: query
        name: pageSize
        type: integer
      - example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of all brands including deleted
          schema:
            allOf:
            - $ref: '#/definitions/api.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/brand.AdminBrandResponse'
                  type: array
                meta:
                  $ref: '#/definitions/pagination.Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: List all brands including soft-deleted ones (Admin)
      tags:
      - Brands
    post:
      consumes:
      - application/json
      description: Adds a new product manufacturer/brand to the store catalog. Brand
        names must be unique.
      parameters:
      - description: Brand details (name and optional external website link)
        in: body
        name: brand
        required: true
        schema:
          $ref: '#/definitions/brand.CreateBrandRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created brand details
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/brand.AdminBrandResponse'
              type: object
        "400":
          description: Validation error or missing brand name
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "409":
          description: A brand with this name already exists
          schema:
            $ref: '#/definitions/api.ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Create a product brand
      tags:
      - Brands
  /admin/brands/{id}:
    delete:
      consumes:
      - application/json
      description: Marks an active brand as soft-deleted (`deleted_at = NOW()`), removing
        it from active listings.
      parameters:
      - description: Brand UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deletion confirmation message
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Brand not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Soft-delete a brand
      tags:
      - Brands
    get:
      consumes:
      - application/json
      description: Retrieves active product brand details by its UUID.
      parameters:
      - description: Brand UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Brand details
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/brand.AdminBrandResponse'
              type: object
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Brand not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Get brand details by ID
      tags:
      - Brands
    patch:
      consumes:
      - application/json
      description: Updates specific fields of an existing brand such as name, website
        link, or logo object reference.
      parameters:
      - description: Brand UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (name, link, logo_id)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/brand.UpdateBrandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Update confirmation message
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Validation error or referenced logo object not found
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Brand not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "409":
          description: A brand with updated name already exists
          schema:
            $ref: '#/definitions/api.ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Update brand details
      tags:
      - Brands
  /admin/brands/{id}/logo:
    put:
      consumes:
      - multipart/form-data
      description: Uploads an image file to be used as the brand's logo
      parameters:
      - description: Brand UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Logo image file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Upload confirmation message
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Invalid UUID format or missing file
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Upload brand logo
      tags:
      - Brands
  /admin/categories:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of all product categories including soft-deleted
        records for administrator taxonomy management.
      parameters:
      - example: 1
        in: query
        name: page
        type: integer
      - example: 10
        in: query
        name: pageSize
        type: integer
      - example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of all categories including deleted
          schema:
            allOf:
            - $ref: '#/definitions/api.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/category.AdminCategoryResponse'
                  type: array
                meta:
                  $ref: '#/definitions/pagination.Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: List all categories including soft-deleted ones (Admin)
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: Creates a new product category in the taxonomy tree. Can optionally
        be assigned a parent category ID for hierarchical nesting.
      parameters:
      - description: Category name and optional parent category UUID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created category details
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/category.AdminCategoryResponse'
              type: object
        "400":
          description: Validation error or referenced parent category does not exist
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "409":
          description: A category with this name already exists
          schema:
            $ref: '#/definitions/api.ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Create a product category
      tags:
      - Categories
  /admin/categories/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves product category details by its UUID.
      parameters:
      - description: Category UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Category details
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/category.AdminCategoryResponse'
              type: object
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Get category details by ID
      tags:
      - Categories
    patch:
      consumes:
      - application/json
      description: Updates specific fields of an existing category (name or parent
        category ID). Guards against self-referencing and circular tree dependencies.
      parameters:
      - description: Category UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (name, parent_id)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Update confirmation message
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Validation error, circular hierarchy, or parent not found
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "409":
          description: A category with updated name already exists
          schema:
            $ref: '#/definitions/api.ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Update category details
      tags:
      - Categories
  /admin/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Updates the status of an existing order.
      parameters:
      - description: Order UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Status update details
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/order.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Status update confirmation
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Validation error or invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Update order status (Admin)
      tags:
      - Orders
  /admin/products:
    get:
      description: Returns a paginated list of all products including draft, published,
        archived, and soft-deleted records for administrator catalog management.
      parameters:
      - example: 1
        in: query
        name: page
        type: integer
      - example: 10
        in: query
        name: pageSize
        type: integer
      - example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of all products including deleted
          schema:
            allOf:
            - $ref: '#/definitions/api.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Product'
                  type: array
                meta:
                  $ref: '#/definitions/pagination.Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: List all products for management (Admin)
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Creates a new product in 'draft' status. Products remain in draft
        state until at least one variant is created and the product is explicitly
        published.
      parameters:
      - description: Product title, description, category ID, optional brand ID and
          highlights
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/product.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created draft product details
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/product.AdminProductDetailsResponse'
              type: object
        "400":
          description: Validation error or invalid UUID reference
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "409":
          description: Product with generated public ID already exists
          schema:
            $ref: '#/definitions/api.ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Create a new draft product
      tags:
      - Products
  /admin/products/{id}:
    delete:
      description: Marks a product as soft-deleted (`deleted_at = NOW()`), removing
        it from active administrative and customer listings.
      parameters:
      - description: Product UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deletion confirmation message
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Soft-delete a product
      tags:
      - Products
    get:
      description: Retrieves full product details by its unique internal UUID.
      parameters:
      - description: Internal Product UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Product details
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/product.AdminProductDetailsResponse'
              type: object
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Get product by internal UUID
      tags:
      - Products
    patch:
      consumes:
      - application/json
      description: Updates specific fields of an existing product such as title, description,
        category, brand, or publication status.
      parameters:
      - description: Product UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (title, description, brand_id, category_id,
          status, highlights)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/product.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated product details
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/product.AdminProductDetailsResponse'
              type: object
        "400":
          description: Validation error or invalid UUID format
          schema:
            $ref: '#/definitions/api.BadRequestErrorResponse'
        "404":
          description: Product, brand, or category not found
          schema:
            $ref: '#/definitions/api.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Update product attributes
      tags:
      - Products
  /admin/products/{id}/archive:
    post:
      description: Transitions a product status to 'archived', hiding it from public
        store front listings while retaining all historical sales and inventory data.
