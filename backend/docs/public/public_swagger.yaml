        type: string
      object:
        $ref: '#/definitions/StorageObjectResponse'
      objectId:
        example: a1b2c3d4-e5f6-7890-1234-56789abcdef0
        type: string
      publicId:
        example: 8f123456-e89b-12d3-a456-426614174000
        type: string
      sortOrder:
        example: 0
        type: integer
      variantId:
        example: 96c4e462-ed4a-4fec-9115-47cbf12206a7
        type: string
    type: object
  VariantMediaSummary:
    properties:
      id:
        type: string
      mediaType:
        type: string
      sortOrder:
        type: integer
      url:
        type: string
    type: object
  VariantResponse:
    properties:
      attributes:
        additionalProperties: {}
        type: object
      currency:
        example: USD
        type: string
      extractedOriginalPrice:
        example: 29.99
        type: number
      extractedPrice:
        example: 24.99
        type: number
      id:
        example: 96c4e462-ed4a-4fec-9115-47cbf12206a7
        type: string
      isDefault:
        example: false
        type: boolean
      media:
        items:
          $ref: '#/definitions/VariantMediaSummary'
        type: array
      originalPrice:
        example: $29.99
        type: string
      price:
        example: $24.99
        type: string
      productId:
        example: 356cbaee-4700-4af5-ac9c-61aeeafd541c
        type: string
      sku:
        type: string
      thumbnail:
        type: string
      title:
        example: Red / XL
        type: string
    type: object
  VerifyChallengeRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
  description: This is the Prim API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Prim API
  version: "1.0"
paths:
  /auth/challenge/resend:
    post:
      consumes:
      - application/json
      description: Resends a new verification code to the provided email or phone
        number if allowed by the challenge policy.
      parameters:
      - description: Resend Challenge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ResendChallengeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadReqResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Resend an authentication challenge
      tags:
      - Auth
  /auth/challenge/start:
    post:
      consumes:
      - application/json
      description: Starts an authentication challenge by sending a verification code
        to the provided email or phone number.
      parameters:
      - description: Challenge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/StartChallengeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/StartChallengeResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadReqResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Start an authentication challenge
      tags:
      - Auth
  /auth/challenge/verify:
    post:
      consumes:
      - application/json
      description: Verifies the one-time code sent to the user's email or phone and
        sets auth cookies.
      parameters:
      - description: Challenge Verification Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/VerifyChallengeRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Verify an authentication challenge
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revokes the current session and clears auth cookies.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: fetch session user data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/MeResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: fetch session user data
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotate refresh token and issue new access and refresh tokens.
      parameters:
      - description: Refresh Token
        in: body
        name: refresh_token
        schema:
          $ref: '#/definitions/RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Rotate refresh token and issue new access and refresh tokens.
      tags:
      - Auth
  /auth/sessions:
    get:
      description: Fetches all active login sessions stored in Redis for the current
        user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/UserSession'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: List active user sessions
      tags:
      - Auth
  /auth/sessions/{id}:
    delete:
      description: Revokes and deletes a specific active session from Redis.
      parameters:
      - description: Session ID to revoke
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Revoke session
      tags:
      - Auth
  /brands:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of active product brands for customer
        storefront browsing.
      parameters:
      - example: 1
        in: query
        name: page
        type: integer
      - example: 10
        in: query
        name: pageSize
        type: integer
      - example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of active brands
          schema:
            allOf:
            - $ref: '#/definitions/PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/BrandResponse'
                  type: array
                meta:
                  $ref: '#/definitions/Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: List active product brands
      tags:
      - Brands
  /cart:
    delete:
      description: Removes all items from the current cart.
      parameters:
      - description: Guest Session ID
        in: header
        name: X-Session-ID
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Cart cleared
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Clear cart
      tags:
      - Cart
    get:
      description: Fetches the current user's or guest session's shopping cart and
        item details.
      parameters:
      - description: Guest Session ID
        in: header
