        type: boolean
      hasPrevious:
        example: false
        type: boolean
      page:
        example: 1
        type: integer
      pageSize:
        example: 10
        type: integer
      totalItems:
        example: 20
        type: integer
      totalPages:
        example: 2
        type: integer
    type: object
  PaginatedResponse:
    properties:
      data: {}
      meta: {}
    type: object
  ProductBrandSummary:
    properties:
      id:
        type: string
      link:
        type: string
      name:
        type: string
    type: object
  ProductDetailsResponse:
