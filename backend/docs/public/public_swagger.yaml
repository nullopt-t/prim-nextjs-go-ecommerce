          $ref: '#/definitions/ProductTagSummary'
        type: array
      title:
        example: Wireless Headphones
        type: string
      variants:
        items:
          $ref: '#/definitions/ProductVariantResponse'
        type: array
    type: object
  ProductListItemResponse:
    properties:
      brand:
        type: string
      currency:
        example: USD
        type: string
      extractedOriginalPrice:
        example: 29.99
        type: number
      extractedPrice:
        example: 24.99
        type: number
      originalPrice:
        example: $29.99
        type: string
      price:
        example: $24.99
        type: string
      rating:
        $ref: '#/definitions/ProductRatingSummaryResponse'
      slug:
        type: string
      thumbnail:
        type: string
      title:
        type: string
