basePath: /api/v1
definitions:
  api.BadReqResponse:
    properties:
      code:
        example: VALIDATION_FAILED
        type: string
      details:
        items:
          $ref: '#/definitions/api.FieldError'
        type: array
      message:
        example: Invalid input or payload parameters
        type: string
    type: object
  api.BadRequestErrorResponse:
    properties:
      code:
        example: VALIDATION_FAILED
        type: string
      details:
        items:
          $ref: '#/definitions/api.FieldError'
        type: array
      message:
        example: Invalid request input or malformed payload
        type: string
    type: object
  api.ConflictErrorResponse:
    properties:
      code:
        example: ALREADY_EXISTS
        type: string
      details:
        items:
          $ref: '#/definitions/api.FieldError'
        type: array
      message:
        example: A resource with this identifier or name already exists
        type: string
    type: object
  api.DataResponse:
    properties:
      data: {}
    type: object
  api.ErrorResponse:
    properties:
      code:
        example: INTERNAL_ERROR
        type: string
      details:
        items:
          $ref: '#/definitions/api.FieldError'
        type: array
      message:
        example: An unexpected internal server error occurred
        type: string
    type: object
  api.FieldError:
    properties:
      field:
        example: name
        type: string
      message:
        example: name is required and cannot be empty
        type: string
      tags:
        example: string
        type: string
    type: object
  api.InternalServerErrorResponse:
    properties:
      code:
        example: INTERNAL_ERROR
        type: string
      details:
        items:
          $ref: '#/definitions/api.FieldError'
        type: array
      message:
        example: An unexpected internal server error occurred
        type: string
    type: object
  api.MessageResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
    type: object
  api.NotFoundErrorResponse:
    properties:
      code:
        example: NOT_FOUND
        type: string
      details:
        items:
          $ref: '#/definitions/api.FieldError'
        type: array
      message:
        example: The requested resource was not found
        type: string
    type: object
  api.PaginatedResponse:
    properties:
      data: {}
      meta: {}
    type: object
  api.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      meta: {}
    type: object
  api.UnauthorizedErrorResponse:
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      details:
