host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
  description: This is the Prim API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Prim API
  version: "1.0"
paths:
  /auth/challenge/resend:
    post:
      consumes:
      - application/json
      description: Resends a new verification code to the provided email or phone
        number if allowed by the challenge policy.
      parameters:
      - description: Resend Challenge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResendChallengeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.BadReqResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Resend an authentication challenge
      tags:
      - Auth
  /auth/challenge/start:
    post:
      consumes:
      - application/json
      description: Starts an authentication challenge by sending a verification code
        to the provided email or phone number.
      parameters:
      - description: Challenge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.StartChallengeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.StartChallengeResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.BadReqResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Start an authentication challenge
      tags:
      - Auth
  /auth/challenge/verify:
    post:
      consumes:
      - application/json
      description: Verifies the one-time code sent to the user's email or phone and
        sets auth cookies.
      parameters:
      - description: Challenge Verification Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyChallengeRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.BadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Verify an authentication challenge
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revokes the current session and clears auth cookies.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: fetch session user data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.MeResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: fetch session user data
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotate refresh token and issue new access and refresh tokens.
      parameters:
      - description: Refresh Token
        in: body
        name: refresh_token
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.BadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.InternalServerErrorResponse'
      summary: Rotate refresh token and issue new access and refresh tokens.
      tags:
      - Auth
  /auth/sessions:
    get:
      description: Fetches all active login sessions stored in Redis for the current
        user.
      produces:
      - application/json
      responses:
        "200":
