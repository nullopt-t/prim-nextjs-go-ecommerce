  ProductRatingSummaryResponse:
    properties:
      averageRating:
        example: 4.5
        type: number
      distribution:
        additionalProperties:
          type: integer
        type: object
      reviewCount:
        example: 24
        type: integer
    type: object
  ProductReviewResponse:
    properties:
      body:
        type: string
      createdAt:
        type: string
      id:
        type: string
      orderItemId:
        type: string
      productId:
        type: string
      rating:
        type: integer
      status:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  ProductTagSummary:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  ProductVariantResponse:
    properties:
      attributes:
        additionalProperties: {}
        type: object
      currency:
        example: USD
        type: string
      extractedOriginalPrice:
        example: 29.99
        type: number
      extractedPrice:
        example: 24.99
        type: number
      id:
        type: string
      isDefault:
        type: boolean
      media:
        items:
          $ref: '#/definitions/VariantMediaSummary'
        type: array
      originalPrice:
