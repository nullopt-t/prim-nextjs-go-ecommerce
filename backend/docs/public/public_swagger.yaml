basePath: /api/v1
definitions:
  AddItemRequest:
    properties:
      quantity:
        description: Quantity of units to add (must be between 1 and 999)
        example: 2
        maximum: 999
        type: integer
      variantId:
        description: Product Variant UUID to add to the cart
        example: 70000000-0000-0000-0000-000000000001
        type: string
    required:
    - quantity
    - variantId
    type: object
  AddToWishlistRequest:
    properties:
      productId:
        description: Product UUID to save to wishlist
        example: 60000000-0000-0000-0000-000000000001
        type: string
      variantId:
        description: Optional specific product variant UUID to save
        example: 70000000-0000-0000-0000-000000000001
        type: string
    required:
    - productId
    type: object
  AddressResponse:
    properties:
      city:
        type: string
      country:
        type: string
      createdAt:
        type: string
      fullName:
        type: string
      id:
        type: string
      isDefault:
        type: boolean
      label:
        type: string
      line1:
        type: string
      line2:
        type: string
      phone:
        type: string
      postalCode:
        type: string
      state:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  ApplyCouponRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  BadReqResponse:
    properties:
      code:
        description: Code is the machine-readable error token ("VALIDATION_FAILED").
        example: VALIDATION_FAILED
        type: string
      details:
        description: Details contains individual field-level validation errors.
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        description: Message describes the validation failure summary.
        example: Invalid request input or malformed payload
        type: string
    type: object
  BadRequestErrorResponse:
    properties:
      code:
        description: Code is the machine-readable error token ("VALIDATION_FAILED").
        example: VALIDATION_FAILED
        type: string
      details:
        description: Details contains individual field-level validation errors.
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        description: Message describes the validation failure summary.
        example: Invalid request input or malformed payload
        type: string
    type: object
  BrandResponse:
    properties:
      id:
        description: Public UUID identifier of the brand
        example: 358b2e03-0b3f-40a4-8163-ebed0cb252ee
        type: string
      link:
        description: Official website URL
        example: https://apple.com
        type: string
      logoUrl:
        description: Publicly accessible URL for the brand logo
        example: https://example.com/apple-logo.png
        type: string
      name:
        description: Brand/manufacturer name
        example: Apple
        type: string
    type: object
  CartItemResponse:
    properties:
      attributes:
        additionalProperties: {}
        description: Variant attributes
        type: object
      availableStock:
        description: Live salable quantity available in inventory
        example: 15
        type: integer
      color:
        description: Selected SKU Variant Color
        example: Midnight
        type: string
      id:
        description: Unique Cart Item record UUID
        example: 030553cd-712a-4950-913f-6c26fdd6a2b5
        type: string
      inStock:
        description: 'Live inventory availability check: true if inventory >= quantity'
        example: true
        type: boolean
      productId:
        description: Parent Product UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      productSlug:
        description: Product Slug for storefront routing
        example: macbook-air-15-m3
        type: string
      quantity:
        description: Selected quantity units in cart
        example: 2
        type: integer
      subtotal:
        description: Line item subtotal (quantity * unitPrice) in cents
        example: 499800
        type: integer
      thumbnailUrl:
        description: Thumbnail preview image URL
        example: https://example.com/thumbnail.png
        type: string
      title:
        description: Formatted line item title (Product Title + Variant Title)
        example: MacBook Pro 16" - Space Black, 18GB RAM, 512GB SSD
        type: string
      unitPrice:
        description: Unit price per single item in cents
        example: 249900
        type: integer
      variantId:
        description: Selected SKU Variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
    type: object
  CartResponse:
    properties:
      currency:
        description: Active store currency code
        example: EGP
        type: string
      id:
        description: Cart UUID
        example: c23c12b7-37ff-49e6-a70f-1dcd122a0b99
        type: string
      itemCount:
        description: Total count of distinct units in cart
        example: 2
        type: integer
      items:
        description: List of all items currently in cart
        items:
          $ref: '#/definitions/CartItemResponse'
        type: array
      summary:
        allOf:
        - $ref: '#/definitions/CartSummaryResponse'
        description: Monetary calculation breakdown
      updatedAt:
        description: Timestamp of the most recent cart mutation (RFC3339)
        example: "2026-08-23T16:26:25Z"
        type: string
    type: object
  CartSummaryResponse:
    properties:
      discount:
        description: Applied discount deductions in cents
        example: 0
        type: integer
      shipping:
        description: Estimated shipping cost in cents
        example: 0
        type: integer
      subtotal:
        description: Sum total of all items before discounts/tax in cents
        example: 499800
        type: integer
      tax:
        description: Estimated tax amount in cents
        example: 0
        type: integer
      total:
        description: Final calculated order total (subtotal - discount + shipping
          + tax) in cents
        example: 499800
        type: integer
    type: object
  CheckoutRequest:
    properties:
      couponId:
        type: string
      paymentMethod:
        type: string
      shippingAddressId:
        type: string
    required:
    - shippingAddressId
    type: object
  CheckoutResponse:
    properties:
      orderId:
        type: string
      paymentStatus:
        type: string
      status:
        type: string
    type: object
  ConflictErrorResponse:
    properties:
      code:
        example: ALREADY_EXISTS
        type: string
      message:
        example: A resource with this identifier or name already exists
        type: string
    type: object
  CouponValidationResult:
    properties:
      code:
        type: string
      discountAmount:
        type: integer
      discountPercent:
        type: integer
      discountType:
        type: string
      discountValue:
        type: integer
      fixedDiscount:
        type: number
      id:
        type: string
      message:
        type: string
      minCartAmount:
        type: integer
      shipping:
        type: integer
      subtotal:
        type: integer
      total:
        type: integer
    type: object
  CreateAddressInput:
    properties:
      city:
        type: string
      country:
        type: string
      fullName:
        type: string
      isDefault:
        type: boolean
      label:
        type: string
      line1:
        type: string
      line2:
        type: string
      phone:
        type: string
      postalCode:
        type: string
      state:
        type: string
    type: object
  CreateReviewRequest:
    properties:
      body:
        description: Review detailed feedback narrative
        example: The M3 Pro chip handles heavy 4K rendering and compiles code effortlessly.
        type: string
      orderItemId:
        description: Optional purchased Order Item UUID (if omitted, server automatically
          verifies buyer eligibility from delivered orders)
        example: 91000000-0000-0000-0000-000000000001
        type: string
      productId:
        description: Product UUID to review
        example: 60000000-0000-0000-0000-000000000001
        type: string
      rating:
        description: Star score between 1 and 5
        example: 5
        maximum: 5
        minimum: 1
        type: integer
      title:
        description: Optional review headline title
        example: Unbelievable performance!
        type: string
    required:
    - productId
    - rating
    type: object
  DataResponse:
    properties:
      data:
        description: Data holds the response payload.
    type: object
  ErrorResponse:
    properties:
      code:
        description: Code is the machine-readable error token ("INTERNAL_ERROR").
        example: INTERNAL_ERROR
        type: string
      details:
        description: Details contains optional validation details if applicable.
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        description: Message describes the error condition.
        example: An unexpected internal server error occurred
        type: string
    type: object
  FieldError:
    properties:
      constraint:
        description: Constraint is the validation tag or rule that was violated (e.g.,
          "min", "required", "email").
        example: min
        type: string
      field:
        description: Field is the name of the request property that failed validation
          (e.g., "quantity", "email").
        example: quantity
        type: string
      message:
        description: Message is the user-friendly explanation of why the value is
          invalid.
        example: quantity must be at least 1
        type: string
    type: object
  ForbiddenErrorResponse:
    properties:
      code:
        example: FORBIDDEN
        type: string
      message:
        example: You do not have permission to access this resource
        type: string
    type: object
  InternalServerErrorResponse:
    properties:
      code:
        example: INTERNAL_ERROR
        type: string
      message:
        example: An unexpected internal server error occurred
        type: string
    type: object
  MeResponse:
    properties:
      createdAt:
        type: string
      id:
        type: string
      identifier:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  MessageResponse:
    properties:
      message:
        description: Message conveys the completion status or outcome of a mutation.
        example: Operation completed successfully
        type: string
    type: object
  NotFoundErrorResponse:
    properties:
      code:
        example: NOT_FOUND
        type: string
      message:
        example: The requested resource was not found
        type: string
    type: object
  NotificationCountResponse:
    properties:
      count:
        type: integer
    type: object
  NotificationItemResponse:
    properties:
      actionUrl:
        type: string
      category:
        type: string
      createdAt:
        type: string
      id:
        type: string
      isRead:
        type: boolean
      message:
        type: string
      metadata:
        type: object
      readAt:
        type: string
      title:
        type: string
    type: object
  OrderItemResponse:
    properties:
      id:
        description: ID is the unique UUID of the order line item.
        type: string
      priceAtPurchase:
        description: PriceAtPurchase is the unit price in minor units (e.g. cents)
          at checkout time.
        type: integer
      productSnapshot:
        description: ProductSnapshot contains immutable JSON metadata captured at
          checkout (e.g. title, SKU, media).
        type: string
      quantity:
        description: Quantity is the number of units purchased.
        type: integer
      variantId:
        description: VariantID is the product variant purchased in this line item.
        type: string
    type: object
  OrderResponse:
    properties:
      codFee:
        description: CODFee is the cash-on-delivery surcharge applied to the order
          in minor currency units.
        type: integer
      couponCode:
        description: CouponCode is the human-readable applied voucher or coupon code.
        type: string
      couponId:
        description: CouponID is the optional applied promotional voucher or coupon
          UUID.
        type: string
      createdAt:
        description: CreatedAt is the RFC3339 creation timestamp.
        type: string
      currency:
        description: Currency is the 3-letter ISO currency code.
        type: string
      customerEmail:
        description: CustomerEmail is the contact email address for transactional
          notifications.
        type: string
      customerId:
        description: CustomerID is the optional authenticated user UUID who placed
          the order.
        type: string
      discountAmount:
        description: DiscountAmount is the deducted amount in minor currency units.
        type: integer
      id:
        description: ID is the unique order UUID.
        type: string
      items:
        description: Items lists the individual line items in this order.
        items:
          $ref: '#/definitions/OrderItemResponse'
        type: array
      paymentMethod:
        description: PaymentMethod is the payment method used for the order.
        type: string
      shippingAddress:
        allOf:
        - $ref: '#/definitions/AddressResponse'
        description: ShippingAddress is the destination address.
      shippingAmount:
        description: ShippingAmount is the shipping charge applied to the order in
          minor currency units.
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/OrderStatus'
        description: Status is the current state of the order lifecycle.
      taxAmount:
        description: TaxAmount is the tax amount applied to the order in minor currency
          units.
        type: integer
      totalAmount:
        description: TotalAmount is the final monetary charge in minor currency units
          after discounts.
        type: integer
      trackingNumber:
        description: TrackingNumber is the carrier tracking number for shipped orders.
        type: string
      updatedAt:
        description: UpdatedAt is the RFC3339 last update timestamp.
        type: string
    type: object
  OrderStatus:
    enum:
    - pending
    - paid
    - processing
    - shipped
    - delivered
    - cancelled
    - cancelled
    - refunded
    type: string
    x-enum-varnames:
    - OrderStatusPending
    - OrderStatusPaid
    - OrderStatusProcessing
    - OrderStatusShipped
    - OrderStatusDelivered
    - OrderStatusCancelled
    - OrderStatusCanceled
    - OrderStatusRefunded
  Page:
    properties:
      hasNext:
        description: HasNext is true if there is a page following the current page.
        example: true
        type: boolean
      hasPrevious:
        description: HasPrevious is true if there is a page preceding the current
          page.
        example: false
        type: boolean
      page:
        description: Page is the current 1-based page index.
        example: 1
        type: integer
      pageSize:
        description: PageSize is the maximum number of items per page.
        example: 10
        type: integer
      totalItems:
        description: TotalItems is the total count of matching items across all pages.
        example: 20
        type: integer
      totalPages:
        description: TotalPages is the total number of pages calculated from TotalItems
          and PageSize.
        example: 2
        type: integer
    type: object
  PaginatedResponse:
    properties:
      data:
        description: Data contains the slice of paginated items.
      meta:
        description: Meta contains the pagination metadata (page, pageSize, totalItems,
          totalPages).
    type: object
  ProductBrandSummary:
    properties:
      link:
        description: Official website URL
        example: https://apple.com
        type: string
      logoUrl:
        description: Publicly accessible URL for the brand logo
        example: https://example.com/apple-logo.png
        type: string
      name:
        description: Brand name
        example: Apple
        type: string
    type: object
  ProductDetailsResponse:
    properties:
      brand:
        allOf:
        - $ref: '#/definitions/ProductBrandSummary'
        description: Associated brand summary
      currency:
        description: Currency ISO code
        example: EGP
        type: string
      description:
        description: Detailed product description
        example: Supercharged by M3 Pro or M3 Max.
        type: string
      extractedOriginalPrice:
        description: Numeric original price
        example: 2999
        type: number
      extractedPrice:
        description: Numeric active price
        example: 2499
        type: number
      highlights:
        description: Bulleted product highlights
        items:
          type: string
        type: array
      id:
        description: Product database UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      originalPrice:
        description: Formatted original crossed-out price
        example: $2999.00
        type: string
      price:
        description: Formatted active price
        example: $2499.00
        type: string
      productType:
        description: 'Product type: simple or variable'
        example: variable
        type: string
      rating:
        allOf:
        - $ref: '#/definitions/ProductRatingSummaryResponse'
        description: Aggregated review score and count
      slug:
        description: URL-friendly unique slug
        example: macbook-pro-16
        type: string
      tags:
        description: Assigned taxonomy tags
        items:
          $ref: '#/definitions/ProductTagSummary'
        type: array
      title:
        description: Product display title
        example: MacBook Pro 16"
        type: string
      variants:
        description: List of all active product variants
        items:
          $ref: '#/definitions/ProductVariantResponse'
        type: array
    type: object
  ProductListItemResponse:
    properties:
      brand:
        description: Brand name
        example: Apple
        type: string
      category:
        allOf:
        - $ref: '#/definitions/PublicCategoryResponse'
        description: Category information
      currency:
        description: Currency ISO code
        example: EGP
        type: string
      extractedOriginalPrice:
        description: Numeric original price
        example: 2999
        type: number
      extractedPrice:
        description: Numeric price value
        example: 2499
        type: number
      id:
        description: Product UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      inStock:
        description: In stock flag
        example: true
        type: boolean
      originalPrice:
        description: Formatted crossed-out original price
        example: $2999.00
        type: string
      price:
        description: Formatted display price
        example: $2499.00
        type: string
      rating:
        allOf:
        - $ref: '#/definitions/ProductRatingSummaryResponse'
        description: Rating summary and score breakdown
      sku:
        description: Stock Keeping Unit
        example: MAC-PRO-001
        type: string
      slug:
        description: URL-friendly unique slug
        example: macbook-pro-16
        type: string
      stockQuantity:
        description: Real-time on-hand available stock count
        example: 50
        type: integer
      thumbnail:
        description: Product card thumbnail URL
        example: https://example.com/thumb.jpg
        type: string
      title:
        description: Product display title
        example: MacBook Pro 16"
        type: string
      variantId:
        description: Default variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
    type: object
  ProductRatingSummaryResponse:
    properties:
      averageRating:
        description: Average review score (1.0 to 5.0)
        example: 4.5
        type: number
      distribution:
        additionalProperties:
          type: integer
        description: Star rating distribution mapping score (1-5) to frequency
        type: object
      reviewCount:
        description: Total count of approved reviews
        example: 24
        type: integer
    type: object
  ProductReviewResponse:
    properties:
      body:
        description: Review text narrative
        example: The M3 Pro chip handles heavy 4K rendering and compiles code effortlessly.
        type: string
      createdAt:
        description: Submission timestamp (RFC3339)
        example: "2026-08-13T07:56:17Z"
        type: string
      id:
        description: Review UUID
        example: 92000000-0000-0000-0000-000000000001
        type: string
      orderItemId:
        description: Verified order item purchase UUID
        example: 91000000-0000-0000-0000-000000000001
        type: string
      productId:
        description: Product UUID being reviewed
        example: 60000000-0000-0000-0000-000000000001
        type: string
      rating:
        description: Score from 1 to 5 stars
        example: 5
        type: integer
      title:
        description: Optional review heading title
        example: Unbelievable performance!
        type: string
      updatedAt:
        description: Last modified timestamp (RFC3339)
        example: "2026-08-13T07:56:17Z"
        type: string
      userId:
        description: Author customer UUID
        example: 10000000-0000-0000-0000-000000000002
        type: string
    type: object
  ProductTagSummary:
    properties:
      id:
        description: Tag UUID
        example: 50000000-0000-0000-0000-000000000001
        type: string
      name:
        description: Tag name
        example: Featured
        type: string
    type: object
  ProductVariantResponse:
    properties:
      attributes:
        additionalProperties: {}
        description: Custom variant attributes (e.g. {"color":"Black","ram":"18GB"})
        type: object
      currency:
        description: Currency ISO code
        example: EGP
        type: string
      extractedOriginalPrice:
        description: Numeric original MSRP price
        example: 2999
        type: number
      extractedPrice:
        description: Numeric price value
        example: 2499
        type: number
      id:
        description: Variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
      isDefault:
        description: True if this variant is the default selection on product pages
        example: true
        type: boolean
      media:
        description: Associated media gallery
        items:
          $ref: '#/definitions/VariantMediaSummary'
        type: array
      originalPrice:
        description: Formatted crossed-out/original MSRP price
        example: $2999.00
        type: string
      price:
        description: Formatted display price
        example: $2499.00
        type: string
      sku:
        description: Unique Stock Keeping Unit
        example: MAC-PRO-16-BLK-18
        type: string
      stock:
        allOf:
        - $ref: '#/definitions/PublicStockSummary'
        description: Live customer-facing stock availability
      thumbnail:
        description: Primary variant thumbnail URL
        example: https://example.com/thumb.jpg
        type: string
      title:
        description: Variant option title (e.g. "Space Black, 18GB RAM")
        example: Space Black, 18GB RAM, 512GB SSD
        type: string
    type: object
  PublicCategoryResponse:
    properties:
      id:
        description: Public category identifier
        example: 40000000-0000-0000-0000-000000000002
        type: string
      name:
        description: Category display name
        example: Electronics
        type: string
    type: object
  PublicConfig:
    properties:
      allowCards:
        type: boolean
      allowCod:
        type: boolean
      announcementEnabled:
        type: boolean
      announcementText:
        type: string
      codFee:
        type: number
      currency:
        type: string
      defaultLocale:
        type: string
      estimatedDeliveryDays:
        type: string
      flatRateShipping:
        type: number
      freeShippingThreshold:
        type: number
      maintenanceMessage:
        type: string
      maintenanceMode:
        type: boolean
      pricesIncludeTax:
        type: boolean
      storeAddress:
        type: string
      storeEmail:
        type: string
      storeName:
        type: string
      storePhone:
        type: string
      taxRatePercent:
        type: number
      timezone:
        type: string
    type: object
  PublicStockResponse:
    properties:
      availableQuantity:
        description: Units available for customer checkout
        example: 50
        type: integer
      isInStock:
        description: True if availableQuantity > 0
        example: true
        type: boolean
    type: object
  PublicStockSummary:
    properties:
      availableQuantity:
        description: Quantity available for customer purchase
        example: 50
        type: integer
      isInStock:
        description: True if availableQuantity > 0
        example: true
        type: boolean
    type: object
  ResendChallengeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  ReviewEligibilityResponse:
    properties:
      canReview:
        type: boolean
    type: object
  ReviewResponse:
    properties:
      body:
        description: Review detailed text
        example: The M3 Pro chip handles heavy 4K rendering and compiles code effortlessly.
        type: string
      createdAt:
        description: Submission timestamp (RFC3339)
        example: "2026-08-13T07:56:17Z"
        type: string
      id:
        description: Review UUID
        example: 92000000-0000-0000-0000-000000000001
        type: string
      orderItemId:
        description: Verified Order Item purchase UUID
        example: 91000000-0000-0000-0000-000000000001
        type: string
      productId:
        description: Reviewed Product UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      rating:
        description: Star score (1-5)
        example: 5
        type: integer
      status:
        description: 'Moderation status: pending, approved, rejected'
        example: approved
        type: string
      title:
        description: Optional review headline
        example: Unbelievable performance!
        type: string
      updatedAt:
        description: Last updated timestamp (RFC3339)
        example: "2026-08-13T07:56:17Z"
        type: string
      userId:
        description: Author Customer UUID
        example: 10000000-0000-0000-0000-000000000002
        type: string
    type: object
  SessionType:
    enum:
    - guest
    - authenticated
    type: string
    x-enum-varnames:
    - SessionTypeGuest
    - SessionTypeAuthenticated
  Sort:
    properties:
      field:
        description: Field is the database column or property name to sort by.
        example: name
        type: string
      order:
        allOf:
        - $ref: '#/definitions/SortOrder'
        description: Order is the sort direction (SortAsc or SortDesc).
        example: asc
    type: object
  SortOrder:
    enum:
    - asc
    - desc
    type: string
    x-enum-varnames:
    - SortAsc
    - SortDesc
  StartChallengeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  StartChallengeResponse:
    properties:
      duration:
        type: integer
      email:
        type: string
      expiresAt:
        type: string
    type: object
  StorageObjectResponse:
    properties:
      bucket:
        description: Storage bucket name
        example: product-media
        type: string
      contentType:
        description: MIME content type
        example: image/webp
        type: string
      fileSize:
        description: File size in bytes
        example: 1048576
        type: integer
      id:
        description: Internal object storage UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      key:
        description: Storage object key / filepath
        example: variants/70000000/image.webp
        type: string
      publicUrl:
        description: Public CDN URL
        example: https://example.com/media/image.webp
        type: string
    type: object
  TagResponse:
    properties:
      id:
        description: Unique UUID identifier of the tag
        example: 50000000-0000-0000-0000-000000000001
        type: string
      name:
        description: Tag label name
        example: Featured
        type: string
    type: object
  UnauthorizedErrorResponse:
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      message:
        example: Authentication token is missing or expired
        type: string
    type: object
  UnauthorizedResponse:
    properties:
      code:
        description: Code is the machine-readable error token ("UNAUTHORIZED").
        example: UNAUTHORIZED
        type: string
      message:
        description: Message describes the authentication failure.
        example: Authentication token is missing or invalid
        type: string
    type: object
  UpdateAddressInput:
    properties:
      city:
        type: string
      country:
        type: string
      fullName:
        type: string
      isDefault:
        type: boolean
      label:
        type: string
      line1:
        type: string
      line2:
        type: string
      phone:
        type: string
      postalCode:
        type: string
      state:
        type: string
    type: object
  UpdateQuantityRequest:
    properties:
      quantity:
        description: New total quantity desired for this cart item (must be between
          1 and 999)
        example: 3
        maximum: 999
        type: integer
    required:
    - quantity
    type: object
  UpdateReviewRequest:
    properties:
      body:
        description: Updated review feedback narrative
        example: Updated feedback after 3 months of continuous daily use.
        type: string
      rating:
        description: Updated star score between 1 and 5
        example: 5
        maximum: 5
        minimum: 1
        type: integer
      title:
        description: Updated review headline title
        example: Updated review headline
        type: string
    type: object
  UserRole:
    enum:
    - superadmin
    - admin
    - support
    - vendor
    - customer
    type: string
    x-enum-varnames:
    - SuperRole
    - AdminRole
    - SupportRole
    - VendorRole
    - CustomerRole
  UserSession:
    properties:
      createdAt:
        description: CreatedAt is the timestamp when the session was created.
        type: string
      id:
        description: ID is the unique random session token stored in client cookies.
        type: string
      ipAddress:
        description: IPAddress records the client network IP address at session creation.
        type: string
      lastActive:
        description: LastActive is the timestamp of the latest request made with this
          session.
        type: string
      type:
        allOf:
        - $ref: '#/definitions/SessionType'
        description: Type indicates guest or authenticated session lifecycle state.
      userAgent:
        description: UserAgent records the client browser or device signature.
        type: string
      userId:
        description: UserID is the database UUID of the authenticated user (uuid.Nil
          for guest sessions).
        type: string
      userRole:
        allOf:
        - $ref: '#/definitions/UserRole'
        description: UserRole specifies the authorization role (e.g., "customer",
          "admin").
    type: object
  VariantMediaResponse:
    properties:
      id:
        description: Media record UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      mediaType:
        description: Media classification (image or video)
        example: image
        type: string
      object:
        allOf:
        - $ref: '#/definitions/StorageObjectResponse'
        description: Detailed storage file metadata
      objectId:
        description: Underlying storage object UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      sortOrder:
        description: Display sequence sort order
        example: 1
        type: integer
      variantId:
        description: Associated variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
    type: object
  VariantMediaSummary:
    properties:
      id:
        description: Media record UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      mediaType:
        description: Media MIME type or format (e.g. image/jpeg, video/mp4)
        example: image/jpeg
        type: string
      sortOrder:
        description: Display sequence sort order
        example: 1
        type: integer
      url:
        description: Public CDN or storage URL
        example: https://example.com/media/headphones.jpg
        type: string
    type: object
  VariantResponse:
    properties:
      attributes:
        additionalProperties: {}
        description: Custom variant attributes
        type: object
      currency:
        description: Currency ISO code
        example: EGP
        type: string
      extractedOriginalPrice:
        description: Numeric original price value
        example: 2999
        type: number
      extractedPrice:
        description: Numeric active price value
        example: 2499
        type: number
      id:
        description: Variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
      isDefault:
        description: True if this is the default variant
        example: true
        type: boolean
      media:
        description: Attached gallery media assets
        items:
          $ref: '#/definitions/VariantMediaSummary'
        type: array
      originalPrice:
        description: Formatted original crossed-out price
        example: $2999.00
        type: string
      price:
        description: Formatted active display price
        example: $2499.00
        type: string
      productId:
        description: Parent product UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      sku:
        description: Stock Keeping Unit
        example: MAC-PRO-16-BLK-18
        type: string
      thumbnail:
        description: Primary thumbnail image URL
        example: https://example.com/thumb.jpg
        type: string
      title:
        description: Variant title
        example: Space Black, 18GB RAM, 512GB SSD
        type: string
    type: object
  VerifyChallengeRequest:
    properties:
      code:
        type: string
      email:
        type: string
      merge_cart:
        type: boolean
    required:
    - code
    - email
    type: object
  WishlistCheckResponse:
    properties:
      inWishlist:
        description: True if the product is currently saved in the user's wishlist
        example: true
        type: boolean
      wishlistItemId:
        description: Wishlist item UUID if present
        example: 030553cd-712a-4950-913f-6c26fdd6a2b5
        type: string
    type: object
  WishlistCountResponse:
    properties:
      count:
        description: Total count of items currently in the user's wishlist
        example: 5
        type: integer
    type: object
  WishlistItemResponse:
    properties:
      createdAt:
        description: Timestamp when item was added to wishlist (RFC3339)
        example: "2026-08-23T16:26:25Z"
        type: string
      id:
        description: Wishlist Item record UUID
        example: 030553cd-712a-4950-913f-6c26fdd6a2b5
        type: string
      product:
        allOf:
        - $ref: '#/definitions/WishlistProductResponse'
        description: Hydrated Product details
      productId:
        description: Saved Product UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      userId:
        description: Customer UUID owning this wishlist item
        example: 10000000-0000-0000-0000-000000000002
        type: string
      variantId:
        description: Saved Variant UUID if specific variant was selected
        example: 70000000-0000-0000-0000-000000000001
        type: string
    type: object
  WishlistProductResponse:
    properties:
      brandName:
        description: Brand display name
        example: Apple
        type: string
      categoryName:
        description: Primary category name
        example: Laptops
        type: string
      currency:
        description: Currency ISO code
        example: EGP
        type: string
      description:
        description: Detailed product description
        example: Supercharged by M3 Pro or M3 Max.
        type: string
      extractedOriginalPrice:
        description: Numeric original crossed-out price
        example: 2999
        type: number
      extractedPrice:
        description: Numeric active display price
        example: 2499
        type: number
      id:
        description: Product database UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      inStock:
        description: Salable inventory availability
        example: true
        type: boolean
      originalPrice:
        description: Formatted original crossed-out price
        example: $2999.00
        type: string
      price:
        description: Formatted active display price
        example: $2499.00
        type: string
      productType:
        description: 'Product type: simple or variable'
        example: variable
        type: string
      slug:
        description: URL-friendly unique slug
        example: macbook-pro-16
        type: string
      thumbnailUrl:
        description: Product display image public URL
        example: https://example.com/thumb.jpg
        type: string
      title:
        description: Product display title
        example: MacBook Pro 16"
        type: string
      variantId:
        description: Variant specific details
        example: 70000000-0000-0000-0000-000000000001
        type: string
      variantSku:
        example: SKU-MBP-16
        type: string
      variantTitle:
        example: Space Black
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
  description: This is the Prim API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Prim API
  version: "1.0"
paths:
  /auth/challenge/resend:
    post:
      consumes:
      - application/json
      description: Resends a new verification code to the provided email or phone
        number if allowed by the challenge policy.
      parameters:
      - description: Resend Challenge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ResendChallengeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadReqResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Resend an authentication challenge
      tags:
      - Auth
  /auth/challenge/start:
    post:
      consumes:
      - application/json
      description: Starts an authentication challenge by sending a verification code
        to the provided email or phone number.
      parameters:
      - description: Challenge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/StartChallengeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/StartChallengeResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadReqResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Start an authentication challenge
      tags:
      - Auth
  /auth/challenge/verify:
    post:
      consumes:
      - application/json
      description: Verifies the one-time code sent to the user's email or phone and
        sets auth cookies.
      parameters:
      - description: Challenge Verification Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/VerifyChallengeRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Verify an authentication challenge
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revokes the current session and clears auth cookies.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: fetch session user data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/MeResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: fetch session user data
      tags:
      - Auth
  /auth/sessions:
    delete:
      description: Revokes and deletes all active sessions from Redis and clears auth
        cookies.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Revoke all active user sessions
      tags:
      - Auth
    get:
      description: Fetches all active login sessions stored in Redis for the current
        user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/UserSession'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: List active user sessions
      tags:
      - Auth
  /auth/sessions/{id}:
    delete:
      description: Revokes and deletes a specific active session from Redis.
      parameters:
      - description: Session ID to revoke
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Revoke session
      tags:
      - Auth
  /brands:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of active product brands for customer
        storefront browsing.
      parameters:
      - description: |-
          Cursor is an opaque keyset token. When present, repositories should use
          keyset pagination instead of OFFSET.
        example: eyJ0IjoiLi4uIiwiaSI6Ii4uLiJ9
        in: query
        name: cursor
        type: string
      - description: |-
          KeysetMode explicitly requests keyset pagination even when no cursor has
          been supplied yet (i.e. for the very first page). Endpoints that still
          serve classic OFFSET pagination use this to opt in per request.
        example: true
        in: query
        name: keyset
        type: boolean
      - description: Page is the requested 1-based page number from query parameters.
        example: 1
        in: query
        name: page
        type: integer
      - description: PageSize is the requested number of items per page.
        example: 10
        in: query
        name: pageSize
        type: integer
      - description: Search is an optional free-text search query string.
        example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        description: RawSort contains the raw sort query strings (e.g. ["name,-created_at"]).
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of active brands
          schema:
            allOf:
            - $ref: '#/definitions/PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/BrandResponse'
                  type: array
                meta:
                  $ref: '#/definitions/Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: List active product brands
      tags:
      - Brands
  /cart:
    delete:
      description: Removes all items from the current cart.
      produces:
      - application/json
      responses:
        "204":
          description: Cart cleared
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Clear cart
      tags:
      - Cart
    get:
      description: Fetches the current user's or guest session's shopping cart and
        item details.
      produces:
      - application/json
      responses:
        "200":
          description: Cart details
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/CartResponse'
              type: object
        "400":
          description: Invalid input or missing session
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Get shopping cart
      tags:
      - Cart
  /cart/items:
    post:
      consumes:
      - application/json
      description: Adds a product variant with specified quantity to the shopping
        cart.
      parameters:
      - description: Item variant and quantity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/AddItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated cart
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/CartResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Variant not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Add item to cart
      tags:
      - Cart
  /cart/items/{id}:
    delete:
      description: Removes a single item from the cart by item ID.
      parameters:
      - description: Cart Item UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Updated cart
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/CartResponse'
              type: object
        "400":
          description: Invalid item ID
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Cart item not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Remove item from cart
      tags:
      - Cart
    patch:
      consumes:
      - application/json
      description: Updates the quantity of a specific item in the cart.
      parameters:
      - description: Cart Item UUID
        in: path
        name: id
        required: true
        type: string
      - description: New quantity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateQuantityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated cart
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/CartResponse'
              type: object
        "400":
          description: Validation error or invalid UUID
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "404":
          description: Cart item not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Update cart item quantity
      tags:
      - Cart
  /categories:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of active product categories for customer
        browsing and navigation.
      parameters:
      - description: |-
          Cursor is an opaque keyset token. When present, repositories should use
          keyset pagination instead of OFFSET.
        example: eyJ0IjoiLi4uIiwiaSI6Ii4uLiJ9
        in: query
        name: cursor
        type: string
      - description: |-
          KeysetMode explicitly requests keyset pagination even when no cursor has
          been supplied yet (i.e. for the very first page). Endpoints that still
          serve classic OFFSET pagination use this to opt in per request.
        example: true
        in: query
        name: keyset
        type: boolean
      - description: Page is the requested 1-based page number from query parameters.
        example: 1
        in: query
        name: page
        type: integer
      - description: PageSize is the requested number of items per page.
        example: 10
        in: query
        name: pageSize
        type: integer
      - description: Search is an optional free-text search query string.
        example: television
        in: query
        name: search
        type: string
      - collectionFormat: csv
        description: RawSort contains the raw sort query strings (e.g. ["name,-created_at"]).
        example:
        - name
        - -created_at
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of active categories
          schema:
            allOf:
            - $ref: '#/definitions/PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/PublicCategoryResponse'
                  type: array
                meta:
                  $ref: '#/definitions/Page'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: List active product categories
      tags:
      - Categories
  /checkout:
    post:
      consumes:
      - application/json
      description: Creates an order from the current user's cart and clears the cart.
      parameters:
      - description: Checkout Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Checkout result
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/CheckoutResponse'
              type: object
        "400":
          description: Validation error or empty cart
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Perform checkout
      tags:
      - Checkout
  /coupons/apply:
    post:
      consumes:
      - application/json
      description: Validates and applies a coupon code, returning discount details.
      parameters:
      - description: Coupon Code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ApplyCouponRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Coupon details
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/CouponValidationResult'
              type: object
        "400":
          description: Invalid or expired coupon
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Apply coupon
      tags:
      - Coupons
  /orders:
    get:
      description: Returns a list of orders belonging to the authenticated customer.
      produces:
      - application/json
      responses:
        "200":
          description: List of orders
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/OrderResponse'
                  type: array
              type: object
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        "500":
          description: Internal server error
