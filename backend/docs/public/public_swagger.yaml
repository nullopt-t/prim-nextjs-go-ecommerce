basePath: /api/v1
definitions:
  AddItemRequest:
    properties:
      quantity:
        example: 2
        type: integer
      variantId:
        example: 96c4e462-ed4a-4fec-9115-47cbf12206a7
        type: string
    required:
    - quantity
    - variantId
    type: object
  AddressRequest:
    properties:
      city:
        type: string
      country:
        type: string
      postalCode:
        type: string
      state:
        type: string
      street:
        type: string
    required:
    - city
    - country
    - postalCode
    - street
    type: object
  AddressResponse:
    properties:
      city:
        type: string
      country:
        type: string
      postalCode:
        type: string
      state:
        type: string
      street:
        type: string
    type: object
  BadReqResponse:
    properties:
      code:
        example: VALIDATION_FAILED
        type: string
      details:
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        example: Invalid request input or malformed payload
        type: string
    type: object
  BadRequestErrorResponse:
    properties:
      code:
        example: VALIDATION_FAILED
        type: string
      details:
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        example: Invalid request input or malformed payload
        type: string
    type: object
  BrandResponse:
    properties:
      id:
        description: Public ID of the brand
        example: 358b2e03-0b3f-40a4-8163-ebed0cb252ee
        type: string
      link:
        example: https://nvidia.com
        type: string
      logoUrl:
        example: https://example.com/logo.png
        type: string
      name:
        example: nvidia
        type: string
    type: object
  CartItemResponse:
    properties:
      id:
        type: string
      inStock:
        type: boolean
      productId:
        type: string
      quantity:
        type: integer
      subtotal:
        type: integer
      thumbnailUrl:
        type: string
      title:
        type: string
      unitPrice:
        type: integer
      variantId:
        type: string
    type: object
  CartResponse:
    properties:
      currency:
        type: string
      id:
        type: string
      itemCount:
        type: integer
      items:
        items:
          $ref: '#/definitions/CartItemResponse'
        type: array
      summary:
        $ref: '#/definitions/CartSummaryResponse'
      updatedAt:
        type: string
    type: object
  CartSummaryResponse:
    properties:
      discount:
        type: integer
      shipping:
        type: integer
      subtotal:
        type: integer
      tax:
        type: integer
      total:
        type: integer
    type: object
  CheckoutRequest:
    properties:
      billingAddress:
        $ref: '#/definitions/AddressRequest'
      couponId:
        type: string
      customerEmail:
        type: string
      shippingAddress:
        $ref: '#/definitions/AddressRequest'
    required:
    - billingAddress
    - customerEmail
    - shippingAddress
    type: object
  CheckoutResponse:
    properties:
      orderId:
        type: string
      status:
        type: string
    type: object
  ConflictErrorResponse:
    properties:
      code:
        example: ALREADY_EXISTS
        type: string
      message:
        example: A resource with this identifier or name already exists
        type: string
    type: object
  CreateReviewRequest:
    properties:
      body:
        example: The sound quality and active noise cancellation are top notch.
        type: string
      orderItemId:
        example: c8ccec1c-ded5-4380-9f78-a1d4eb3d4f28
        type: string
      productId:
        example: 356cbaee-4700-4af5-ac9c-61aeeafd541c
        type: string
      rating:
        example: 5
        maximum: 5
        minimum: 1
        type: integer
      title:
        example: Amazing headphones!
        type: string
    required:
    - orderItemId
    - productId
    - rating
    type: object
  DataResponse:
    properties:
      data: {}
    type: object
  ErrorResponse:
    properties:
      code:
        example: INTERNAL_ERROR
        type: string
      details:
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        example: An unexpected internal server error occurred
        type: string
    type: object
  FieldError:
    properties:
      constraint:
        example: min
        type: string
      field:
        example: quantity
        type: string
      message:
        example: quantity must be at least 1
        type: string
    type: object
  ForbiddenErrorResponse:
    properties:
      code:
        example: FORBIDDEN
        type: string
      message:
        example: You do not have permission to access this resource
        type: string
    type: object
  InternalServerErrorResponse:
    properties:
      code:
        example: INTERNAL_ERROR
        type: string
      message:
        example: An unexpected internal server error occurred
        type: string
    type: object
  MeResponse:
    properties:
      createdAt:
        type: string
      id:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  MessageResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
    type: object
  NotFoundErrorResponse:
    properties:
      code:
        example: NOT_FOUND
        type: string
      message:
        example: The requested resource was not found
        type: string
    type: object
  OrderItemResponse:
    properties:
      id:
        type: string
      priceAtPurchase:
        type: integer
      productSnapshot:
        type: string
      quantity:
        type: integer
      variantId:
        type: string
    type: object
  OrderResponse:
    properties:
      billingAddress:
        $ref: '#/definitions/AddressResponse'
      couponId:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      customerEmail:
        type: string
      customerId:
        type: string
      discountAmount:
        type: integer
      id:
        type: string
      items:
