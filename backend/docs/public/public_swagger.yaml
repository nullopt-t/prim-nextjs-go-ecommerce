        type: string
    type: object
  UnauthorizedResponse:
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      message:
        example: Authentication token is missing or invalid
        type: string
    type: object
  UpdateQuantityRequest:
    properties:
      quantity:
        example: 5
        type: integer
    required:
    - quantity
    type: object
  UpdateReviewRequest:
    properties:
      body:
        example: Updated review body.
        type: string
      rating:
        example: 4
        maximum: 5
        minimum: 1
        type: integer
      title:
        example: Updated title
        type: string
    type: object
  UserSession:
    properties:
      createdAt:
        type: string
      currentRefreshJti:
        type: string
      id:
        type: string
      ipAddress:
        type: string
      lastActive:
        type: string
      type:
