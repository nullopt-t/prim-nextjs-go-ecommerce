basePath: /api/v1
definitions:
  AddItemRequest:
    properties:
      quantity:
        description: Quantity of units to add (must be at least 1)
        example: 2
        type: integer
      variantId:
        description: Product Variant UUID to add to the cart
        example: 70000000-0000-0000-0000-000000000001
        type: string
    required:
    - quantity
    - variantId
    type: object
  AddressRequest:
    properties:
      city:
        type: string
      country:
        type: string
      postalCode:
        type: string
      state:
        type: string
      street:
        type: string
    required:
    - city
    - country
    - postalCode
    - street
    type: object
  AddressResponse:
    properties:
      city:
        type: string
      country:
        type: string
      postalCode:
        type: string
      state:
        type: string
      street:
        type: string
    type: object
  BadReqResponse:
    properties:
      code:
        example: VALIDATION_FAILED
        type: string
      details:
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        example: Invalid request input or malformed payload
        type: string
    type: object
  BadRequestErrorResponse:
    properties:
      code:
        example: VALIDATION_FAILED
        type: string
      details:
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        example: Invalid request input or malformed payload
        type: string
    type: object
  BrandResponse:
    properties:
      id:
        description: Public UUID identifier of the brand
        example: 358b2e03-0b3f-40a4-8163-ebed0cb252ee
        type: string
      link:
        description: Official website URL
        example: https://apple.com
        type: string
      logoUrl:
        description: Publicly accessible URL for the brand logo
        example: https://example.com/apple-logo.png
        type: string
      name:
        description: Brand/manufacturer name
        example: Apple
        type: string
    type: object
  CartItemResponse:
    properties:
      id:
        description: Unique Cart Item record UUID
        example: 030553cd-712a-4950-913f-6c26fdd6a2b5
        type: string
      inStock:
        description: 'Live inventory availability check: true if inventory >= quantity'
        example: true
        type: boolean
      productId:
        description: Parent Product UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      quantity:
        description: Selected quantity units in cart
        example: 2
        type: integer
      subtotal:
        description: Line item subtotal (quantity * unitPrice) in cents
        example: 499800
        type: integer
      thumbnailUrl:
        description: Thumbnail preview image URL
        example: https://example.com/thumbnail.png
        type: string
      title:
        description: Formatted line item title (Product Title + Variant Title)
        example: MacBook Pro 16" - Space Black, 18GB RAM, 512GB SSD
        type: string
      unitPrice:
        description: Unit price per single item in cents
        example: 249900
        type: integer
      variantId:
        description: Selected SKU Variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
    type: object
  CartResponse:
    properties:
      currency:
        description: Active store currency code
        example: USD
        type: string
      id:
        description: Cart UUID
        example: c23c12b7-37ff-49e6-a70f-1dcd122a0b99
        type: string
      itemCount:
        description: Total count of distinct units in cart
        example: 2
        type: integer
      items:
        description: List of all items currently in cart
        items:
          $ref: '#/definitions/CartItemResponse'
        type: array
      summary:
        allOf:
        - $ref: '#/definitions/CartSummaryResponse'
        description: Monetary calculation breakdown
      updatedAt:
        description: Timestamp of the most recent cart mutation (RFC3339)
        example: "2026-08-23T16:26:25Z"
        type: string
    type: object
  CartSummaryResponse:
    properties:
      discount:
        description: Applied discount deductions in cents
        example: 0
        type: integer
      shipping:
        description: Estimated shipping cost in cents
        example: 0
        type: integer
      subtotal:
        description: Sum total of all items before discounts/tax in cents
        example: 499800
        type: integer
      tax:
        description: Estimated tax amount in cents
        example: 0
        type: integer
      total:
        description: Final calculated order total (subtotal - discount + shipping
          + tax) in cents
        example: 499800
        type: integer
    type: object
  CheckoutRequest:
    properties:
      billingAddress:
        $ref: '#/definitions/AddressRequest'
      couponId:
        type: string
      customerEmail:
        type: string
      shippingAddress:
        $ref: '#/definitions/AddressRequest'
    required:
    - billingAddress
    - customerEmail
    - shippingAddress
    type: object
  CheckoutResponse:
    properties:
      orderId:
        type: string
      status:
        type: string
    type: object
  ConflictErrorResponse:
    properties:
      code:
        example: ALREADY_EXISTS
        type: string
      message:
        example: A resource with this identifier or name already exists
        type: string
    type: object
  CreateReviewRequest:
    properties:
      body:
        description: Review detailed feedback narrative
        example: The M3 Pro chip handles heavy 4K rendering and compiles code effortlessly.
        type: string
      orderItemId:
        description: Optional purchased Order Item UUID (if omitted, server automatically
          verifies buyer eligibility from delivered orders)
        example: 91000000-0000-0000-0000-000000000001
        type: string
      productId:
        description: Product UUID to review
        example: 60000000-0000-0000-0000-000000000001
        type: string
      rating:
        description: Star score between 1 and 5
        example: 5
        maximum: 5
        minimum: 1
        type: integer
      title:
        description: Optional review headline title
        example: Unbelievable performance!
        type: string
    required:
    - productId
    - rating
    type: object
  DataResponse:
    properties:
      data: {}
    type: object
  ErrorResponse:
    properties:
      code:
        example: INTERNAL_ERROR
        type: string
      details:
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        example: An unexpected internal server error occurred
        type: string
    type: object
  FieldError:
    properties:
      constraint:
        example: min
        type: string
      field:
        example: quantity
        type: string
      message:
        example: quantity must be at least 1
        type: string
    type: object
  ForbiddenErrorResponse:
    properties:
      code:
        example: FORBIDDEN
        type: string
      message:
        example: You do not have permission to access this resource
        type: string
    type: object
  InternalServerErrorResponse:
    properties:
      code:
        example: INTERNAL_ERROR
        type: string
      message:
        example: An unexpected internal server error occurred
        type: string
    type: object
  MeResponse:
    properties:
      createdAt:
        type: string
      id:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  MessageResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
    type: object
  NotFoundErrorResponse:
    properties:
      code:
        example: NOT_FOUND
        type: string
      message:
        example: The requested resource was not found
        type: string
    type: object
  OrderItemResponse:
    properties:
      id:
        type: string
      priceAtPurchase:
        type: integer
      productSnapshot:
        type: string
      quantity:
        type: integer
      variantId:
        type: string
    type: object
  OrderResponse:
    properties:
      billingAddress:
        $ref: '#/definitions/AddressResponse'
      couponId:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      customerEmail:
        type: string
      customerId:
        type: string
      discountAmount:
        type: integer
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/OrderItemResponse'
        type: array
      shippingAddress:
        $ref: '#/definitions/AddressResponse'
      status:
        $ref: '#/definitions/OrderStatus'
      totalAmount:
        type: integer
      updatedAt:
        type: string
    type: object
  OrderStatus:
    enum:
    - pending
    - paid
    - processing
    - shipped
    - delivered
    - canceled
    - refunded
    type: string
    x-enum-varnames:
    - OrderStatusPending
    - OrderStatusPaid
    - OrderStatusProcessing
    - OrderStatusShipped
    - OrderStatusDelivered
    - OrderStatusCanceled
    - OrderStatusRefunded
  Page:
    properties:
      hasNext:
        example: true
        type: boolean
      hasPrevious:
        example: false
        type: boolean
      page:
        example: 1
        type: integer
      pageSize:
        example: 10
        type: integer
      totalItems:
        example: 20
        type: integer
      totalPages:
        example: 2
        type: integer
    type: object
  PaginatedResponse:
    properties:
      data: {}
      meta: {}
    type: object
  ProductBrandSummary:
    properties:
      link:
        description: Official website URL
        example: https://apple.com
        type: string
      logoUrl:
        description: Publicly accessible URL for the brand logo
        example: https://example.com/apple-logo.png
        type: string
      name:
        description: Brand name
        example: Apple
        type: string
    type: object
  ProductDetailsResponse:
    properties:
      brand:
        allOf:
        - $ref: '#/definitions/ProductBrandSummary'
        description: Associated brand summary
      currency:
        description: Currency ISO code
        example: USD
        type: string
      description:
        description: Detailed product description
        example: Supercharged by M3 Pro or M3 Max.
        type: string
      extractedOriginalPrice:
        description: Numeric original price
        example: 2999
        type: number
      extractedPrice:
        description: Numeric active price
        example: 2499
        type: number
      highlights:
        description: Bulleted product highlights
        items:
          type: string
        type: array
      id:
        description: Product database UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      originalPrice:
        description: Formatted original crossed-out price
        example: $2999.00
        type: string
      price:
        description: Formatted active price
        example: $2499.00
        type: string
      productType:
        description: 'Product type: simple or variable'
        example: variable
        type: string
      rating:
        allOf:
        - $ref: '#/definitions/ProductRatingSummaryResponse'
        description: Aggregated review score and count
      slug:
        description: URL-friendly unique slug
        example: macbook-pro-16
        type: string
      tags:
        description: Assigned taxonomy tags
        items:
          $ref: '#/definitions/ProductTagSummary'
        type: array
      title:
        description: Product display title
        example: MacBook Pro 16"
        type: string
      variants:
        description: List of all active product variants
        items:
          $ref: '#/definitions/ProductVariantResponse'
        type: array
    type: object
  ProductListItemResponse:
    properties:
      brand:
        description: Brand name
        example: Apple
        type: string
      currency:
        description: Currency ISO code
        example: USD
        type: string
      extractedOriginalPrice:
        description: Numeric original price
        example: 2999
        type: number
      extractedPrice:
        description: Numeric price value
        example: 2499
        type: number
      originalPrice:
        description: Formatted crossed-out original price
        example: $2999.00
        type: string
      price:
        description: Formatted display price
        example: $2499.00
        type: string
      rating:
        allOf:
        - $ref: '#/definitions/ProductRatingSummaryResponse'
        description: Rating summary and score breakdown
      slug:
        description: URL-friendly unique slug
        example: macbook-pro-16
        type: string
      thumbnail:
        description: Product card thumbnail URL
        example: https://example.com/thumb.jpg
        type: string
      title:
        description: Product display title
        example: MacBook Pro 16"
        type: string
    type: object
  ProductRatingSummaryResponse:
    properties:
      averageRating:
        description: Average review score (1.0 to 5.0)
        example: 4.5
        type: number
      distribution:
        additionalProperties:
          type: integer
        description: Star rating distribution mapping score (1-5) to frequency
        type: object
      reviewCount:
        description: Total count of approved reviews
        example: 24
        type: integer
    type: object
  ProductReviewResponse:
    properties:
      body:
        description: Review text narrative
        example: The M3 Pro chip handles heavy 4K rendering and compiles code effortlessly.
        type: string
      createdAt:
        description: Submission timestamp (RFC3339)
        example: "2026-08-13T07:56:17Z"
        type: string
      id:
        description: Review UUID
        example: 92000000-0000-0000-0000-000000000001
        type: string
      orderItemId:
        description: Verified order item purchase UUID
        example: 91000000-0000-0000-0000-000000000001
        type: string
      productId:
        description: Product UUID being reviewed
        example: 60000000-0000-0000-0000-000000000001
        type: string
      rating:
        description: Score from 1 to 5 stars
        example: 5
        type: integer
      status:
        description: 'Moderation state: pending, approved, rejected'
        example: approved
        type: string
      title:
        description: Optional review heading title
        example: Unbelievable performance!
        type: string
      updatedAt:
        description: Last modified timestamp (RFC3339)
        example: "2026-08-13T07:56:17Z"
        type: string
      userId:
        description: Author customer UUID
        example: 10000000-0000-0000-0000-000000000002
        type: string
    type: object
  ProductTagSummary:
    properties:
      id:
        description: Tag UUID
        example: 50000000-0000-0000-0000-000000000001
        type: string
      name:
        description: Tag name
        example: Featured
        type: string
    type: object
  ProductVariantResponse:
    properties:
      attributes:
        additionalProperties: {}
        description: Custom variant attributes (e.g. {"color":"Black","ram":"18GB"})
        type: object
      currency:
        description: Currency ISO code
        example: USD
        type: string
      extractedOriginalPrice:
        description: Numeric original MSRP price
        example: 2999
        type: number
      extractedPrice:
        description: Numeric price value
        example: 2499
        type: number
      id:
        description: Variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
      isDefault:
        description: True if this variant is the default selection on product pages
        example: true
        type: boolean
      media:
        description: Associated media gallery
        items:
          $ref: '#/definitions/VariantMediaSummary'
        type: array
      originalPrice:
        description: Formatted crossed-out/original MSRP price
        example: $2999.00
        type: string
      price:
        description: Formatted display price
        example: $2499.00
        type: string
      sku:
        description: Unique Stock Keeping Unit
        example: MAC-PRO-16-BLK-18
        type: string
      stock:
        allOf:
        - $ref: '#/definitions/PublicStockSummary'
        description: Live customer-facing stock availability
      thumbnail:
        description: Primary variant thumbnail URL
        example: https://example.com/thumb.jpg
        type: string
      title:
        description: Variant option title (e.g. "Space Black, 18GB RAM")
        example: Space Black, 18GB RAM, 512GB SSD
        type: string
    type: object
  PublicCategoryResponse:
    properties:
      id:
        description: Public category identifier
        example: 40000000-0000-0000-0000-000000000002
        type: string
      name:
        description: Category display name
        example: Electronics
        type: string
    type: object
  PublicStockResponse:
    properties:
      availableQuantity:
        description: Units available for customer checkout
        example: 50
        type: integer
      isInStock:
        description: True if availableQuantity > 0
        example: true
        type: boolean
    type: object
  PublicStockSummary:
    properties:
      availableQuantity:
        description: Quantity available for customer purchase
        example: 50
        type: integer
      isInStock:
        description: True if availableQuantity > 0
        example: true
        type: boolean
    type: object
  RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    type: object
  ResendChallengeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  ReviewResponse:
    properties:
      body:
        description: Review detailed text
        example: The M3 Pro chip handles heavy 4K rendering and compiles code effortlessly.
        type: string
      createdAt:
        description: Submission timestamp (RFC3339)
        example: "2026-08-13T07:56:17Z"
        type: string
      id:
        description: Review UUID
        example: 92000000-0000-0000-0000-000000000001
        type: string
      orderItemId:
        description: Verified Order Item purchase UUID
        example: 91000000-0000-0000-0000-000000000001
        type: string
      productId:
        description: Reviewed Product UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      rating:
        description: Star score (1-5)
        example: 5
        type: integer
      status:
        description: 'Moderation status: pending, approved, rejected'
        example: approved
        type: string
      title:
        description: Optional review headline
        example: Unbelievable performance!
        type: string
      updatedAt:
        description: Last updated timestamp (RFC3339)
        example: "2026-08-13T07:56:17Z"
        type: string
      userId:
        description: Author Customer UUID
        example: 10000000-0000-0000-0000-000000000002
        type: string
    type: object
  SessionType:
    enum:
    - guest
    - authenticated
    type: string
    x-enum-varnames:
    - SessionTypeGuest
    - SessionTypeAuthenticated
  Sort:
    properties:
      field:
        example: name
        type: string
      order:
        allOf:
        - $ref: '#/definitions/SortOrder'
        example: asc
    type: object
  SortOrder:
    enum:
    - asc
    - desc
    type: string
    x-enum-varnames:
    - SortAsc
    - SortDesc
  StartChallengeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  StartChallengeResponse:
    properties:
      duration:
        type: integer
      email:
        type: string
      expiresAt:
        type: string
    type: object
  StorageObjectResponse:
    properties:
      bucket:
        description: Storage bucket name
        example: product-media
        type: string
      contentType:
        description: MIME content type
        example: image/webp
        type: string
      fileSize:
        description: File size in bytes
        example: 1048576
        type: integer
      id:
        description: Internal object storage UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      key:
        description: Storage object key / filepath
        example: variants/70000000/image.webp
        type: string
      publicUrl:
        description: Public CDN URL
        example: https://example.com/media/image.webp
        type: string
    type: object
  SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      meta: {}
    type: object
  TagResponse:
    properties:
      id:
        description: Unique UUID identifier of the tag
        example: 50000000-0000-0000-0000-000000000001
        type: string
      name:
        description: Tag label name
        example: Featured
        type: string
    type: object
  UnauthorizedErrorResponse:
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      message:
        example: Authentication token is missing or expired
        type: string
    type: object
  UnauthorizedResponse:
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      message:
        example: Authentication token is missing or invalid
        type: string
    type: object
  UpdateQuantityRequest:
    properties:
      quantity:
        description: New total quantity desired for this cart item (must be at least
          1)
        example: 3
        type: integer
    required:
    - quantity
    type: object
  UpdateReviewRequest:
    properties:
      body:
        description: Updated review feedback narrative
        example: Updated feedback after 3 months of continuous daily use.
        type: string
      rating:
        description: Updated star score between 1 and 5
        example: 5
        maximum: 5
        minimum: 1
        type: integer
      title:
        description: Updated review headline title
        example: Updated review headline
        type: string
    type: object
  UserSession:
    properties:
      createdAt:
        type: string
      currentRefreshJti:
        type: string
      id:
        type: string
      ipAddress:
        type: string
      lastActive:
        type: string
      type:
        $ref: '#/definitions/SessionType'
      userAgent:
        type: string
      userId:
        type: string
    type: object
  VariantMediaResponse:
    properties:
      id:
        description: Media record UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      mediaType:
        description: Media classification (image or video)
        example: image
        type: string
      object:
        allOf:
        - $ref: '#/definitions/StorageObjectResponse'
        description: Detailed storage file metadata
      objectId:
        description: Underlying storage object UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      sortOrder:
        description: Display sequence sort order
        example: 1
        type: integer
      variantId:
        description: Associated variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
    type: object
  VariantMediaSummary:
    properties:
      id:
        description: Media record UUID
        example: 80000000-0000-0000-0000-000000000001
        type: string
      mediaType:
        description: Media MIME type or format (e.g. image/jpeg, video/mp4)
        example: image/jpeg
        type: string
      sortOrder:
        description: Display sequence sort order
        example: 1
        type: integer
      url:
        description: Public CDN or storage URL
        example: https://example.com/media/headphones.jpg
        type: string
    type: object
  VariantResponse:
    properties:
      attributes:
        additionalProperties: {}
        description: Custom variant attributes
        type: object
      currency:
        description: Currency ISO code
        example: USD
        type: string
      extractedOriginalPrice:
        description: Numeric original price value
        example: 2999
        type: number
      extractedPrice:
        description: Numeric active price value
        example: 2499
        type: number
      id:
        description: Variant UUID
        example: 70000000-0000-0000-0000-000000000001
        type: string
      isDefault:
        description: True if this is the default variant
        example: true
        type: boolean
      media:
        description: Attached gallery media assets
        items:
          $ref: '#/definitions/VariantMediaSummary'
        type: array
      originalPrice:
        description: Formatted original crossed-out price
        example: $2999.00
        type: string
      price:
        description: Formatted active display price
        example: $2499.00
        type: string
      productId:
        description: Parent product UUID
        example: 60000000-0000-0000-0000-000000000001
        type: string
      sku:
        description: Stock Keeping Unit
        example: MAC-PRO-16-BLK-18
        type: string
      thumbnail:
        description: Primary thumbnail image URL
        example: https://example.com/thumb.jpg
        type: string
      title:
        description: Variant title
        example: Space Black, 18GB RAM, 512GB SSD
        type: string
    type: object
  VerifyChallengeRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
  description: This is the Prim API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Prim API
  version: "1.0"
paths:
  /auth/challenge/resend:
    post:
      consumes:
      - application/json
      description: Resends a new verification code to the provided email or phone
        number if allowed by the challenge policy.
      parameters:
      - description: Resend Challenge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ResendChallengeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadReqResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      summary: Resend an authentication challenge
      tags:
      - Auth
  /auth/challenge/start:
    post:
      consumes:
      - application/json
      description: Starts an authentication challenge by sending a verification code
        to the provided email or phone number.
      parameters:
      - description: Challenge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/StartChallengeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
