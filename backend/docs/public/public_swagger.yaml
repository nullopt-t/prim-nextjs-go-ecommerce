        type: string
      price:
        example: $24.99
        type: string
      sku:
        type: string
      stock:
        $ref: '#/definitions/PublicStockSummary'
      thumbnail:
        type: string
      title:
        type: string
    type: object
  PublicCategoryResponse:
    properties:
      id:
        example: prod_cat_123
        type: string
      name:
        example: Electronics
        type: string
    type: object
  PublicStockResponse:
    properties:
      availableQuantity:
        example: 45
        type: integer
      isInStock:
        example: true
        type: boolean
    type: object
  PublicStockSummary:
    properties:
      availableQuantity:
        type: integer
      isInStock:
        type: boolean
    type: object
  RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    type: object
  ResendChallengeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  ReviewResponse:
    properties:
      body:
        example: The sound quality is top notch.
        type: string
      createdAt:
        example: "2026-08-10T15:00:00Z"
        type: string
      id:
        example: 8f123456-e89b-12d3-a456-426614174000
        type: string
      orderItemId:
        example: c8ccec1c-ded5-4380-9f78-a1d4eb3d4f28
        type: string
      productId:
        example: 356cbaee-4700-4af5-ac9c-61aeeafd541c
        type: string
      rating:
        example: 5
        type: integer
      status:
        example: pending
        type: string
      title:
        example: Amazing headphones!
        type: string
      updatedAt:
        example: "2026-08-10T15:00:00Z"
        type: string
      userId:
        example: a1b2c3d4-e5f6-7890-1234-56789abcdef0
        type: string
    type: object
  SessionType:
    enum:
    - guest
    - authenticated
    type: string
    x-enum-varnames:
    - SessionTypeGuest
    - SessionTypeAuthenticated
  Sort:
    properties:
      field:
        example: name
        type: string
      order:
        allOf:
        - $ref: '#/definitions/SortOrder'
        example: asc
    type: object
  SortOrder:
    enum:
    - asc
    - desc
    type: string
    x-enum-varnames:
    - SortAsc
    - SortDesc
  StartChallengeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  StartChallengeResponse:
    properties:
      duration:
        type: integer
      email:
        type: string
      expiresAt:
        type: string
    type: object
  StorageObjectResponse:
    properties:
      bucket:
        type: string
      contentType:
        type: string
      fileSize:
        type: integer
      id:
        type: string
      key:
        type: string
      publicUrl:
        type: string
    type: object
  SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      meta: {}
    type: object
  TagResponse:
    properties:
      id:
        example: c8ccec1c-ded5-4380-9f78-a1d4eb3d4f28
