    x-enum-varnames:
    - OrderStatusPending
    - OrderStatusPaid
    - OrderStatusProcessing
    - OrderStatusShipped
    - OrderStatusDelivered
    - OrderStatusCanceled
    - OrderStatusRefunded
  Page:
    properties:
