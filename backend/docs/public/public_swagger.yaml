          type: string
        type: array
      id:
        example: a1b2c3d4-e5f6-7890-1234-56789abcdef0
        type: string
      originalPrice:
        example: $29.99
        type: string
      price:
        example: $24.99
        type: string
      productType:
        type: string
      rating:
        $ref: '#/definitions/ProductRatingSummaryResponse'
      slug:
