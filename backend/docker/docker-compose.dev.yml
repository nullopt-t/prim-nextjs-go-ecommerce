services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "8081:8081"
    command: air -c configs/air.api.toml
    environment:
      PORT: "8081"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # worker:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile.dev
  #   volumes:
  #     - ..:/app
  #     - go-mod-cache:/go/pkg/mod
  #   command: air -c configs/air.worker.toml
  #   env_file:
  #     - ../.env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: prim
      POSTGRES_USER: prim
      POSTGRES_PASSWORD: prim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ../migrations:/migrations
    env_file:
      - ../.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        migrate -path /migrations
        -database "postgres://prim:prim@postgres:5432/prim?sslmode=disable"
        up
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../.env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../seed/media:/seed/media:ro
    env_file:
      - ../.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /usr/bin/mc alias set myminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        /usr/bin/mc mb --ignore-existing myminio/catalog;
        /usr/bin/mc anonymous set download myminio/catalog;
        if [ -d /seed/media/catalog ]; then /usr/bin/mc cp --recursive /seed/media/catalog/ myminio/catalog/; fi;
        exit 0;

volumes:
  postgres_data:
  redis_data:
  go-mod-cache:
  minio_data:
