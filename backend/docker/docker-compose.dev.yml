services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "8081:8081"
    command: air -c configs/air.api.toml
    environment:
      PORT: "8081"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # worker:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile.dev
  #   volumes:
  #     - ..:/app
  #     - go-mod-cache:/go/pkg/mod
  #   command: air -c configs/air.worker.toml
  #   env_file:
  #     - ../.env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: prim
      POSTGRES_USER: prim
      POSTGRES_PASSWORD: prim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ../migrations:/migrations
    env_file:
      - ../.env
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://prim:prim@postgres:5432/prim?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  floci:
    image: floci/floci:latest
    restart: unless-stopped
    ports:
      - "4566:4566"
    volumes:
      - floci_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_HOSTNAME: floci
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1

  s3-init:
    image: amazon/aws-cli
    depends_on:
      floci:
        condition: service_healthy
    volumes:
      - ../seed/media:/seed/media:ro
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    env_file:
      - ../.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://floci:4566 s3api create-bucket --bucket catalog 2>/dev/null || true;
        aws --endpoint-url http://floci:4566 s3api create-bucket --bucket product-thumbnails 2>/dev/null || true;
        aws --endpoint-url http://floci:4566 s3api create-bucket --bucket product-media 2>/dev/null || true;
        if [ -d /seed/media/catalog ]; then aws --endpoint-url http://floci:4566 s3 sync /seed/media/catalog/ s3://catalog/; fi;
        exit 0;

volumes:
  postgres_data:
  redis_data:
  go-mod-cache:
  floci_data:
