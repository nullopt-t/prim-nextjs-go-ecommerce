services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: prim
      POSTGRES_USER: prim
      POSTGRES_PASSWORD: prim
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    image: migrate/migrate
    env_file:
      - ../.env
    volumes:
      - ../migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec migrate -path /migrations -database "$${DATABASE_URL}" up']
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in backend/.env}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:-http://localhost:4566}
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      PORT: "3000"
      # Server-only API URL used by SSR fetchers inside the Compose network.
      # The build arg (set above) bakes the browser-facing
      # NEXT_PUBLIC_API_URL into the client bundle.
      API_URL: "http://api:8080"
      NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:-http://localhost:4566}
    env_file:
      - ../.env
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    ports:
      - "8081:8080"
    restart: unless-stopped
    environment:
      PORT: "8080"
    env_file:
      - ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    command: ./worker
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - floci_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_HOSTNAME: floci
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1

  s3-init:
    image: amazon/aws-cli
    depends_on:
      floci:
        condition: service_healthy
    volumes:
      - ../seed/media:/seed/media:ro
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    env_file:
      - ../.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://floci:4566 s3api create-bucket --bucket catalog 2>/dev/null || true;
        aws --endpoint-url http://floci:4566 s3api create-bucket --bucket product-thumbnails 2>/dev/null || true;
        aws --endpoint-url http://floci:4566 s3api create-bucket --bucket product-media 2>/dev/null || true;
        aws --endpoint-url http://floci:4566 s3api put-bucket-policy --bucket catalog --policy '{"Version":"2012-10-17","Statement":[{"Sid":"PublicRead","Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::catalog/*"}]}' 2>/dev/null || true;
        if [ -d /seed/media/catalog ]; then aws --endpoint-url http://floci:4566 s3 sync /seed/media/catalog/ s3://catalog/; fi;
        exit 0;

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    env_file:
      - ../.env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      # The JVM-based check needs ~11s to run; a shorter timeout SIGKILLs it.
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  floci_data:
  kafka_data:
