services:
  migrate:
    image: migrate/migrate
    env_file:
      - ../.env
    volumes:
      - ../migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec migrate -path /migrations -database "$${DATABASE_URL}" up']
    restart: "no"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in backend/.env}
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      PORT: "3000"
    env_file:
      - ../.env
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      PORT: "8080"
    env_file:
      - ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    command: ./worker
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../.env
    volumes:
      - minio_data:/data

volumes:
  minio_data:
