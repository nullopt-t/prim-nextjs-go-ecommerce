services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: prim
      POSTGRES_USER: prim
      POSTGRES_PASSWORD: prim
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    image: migrate/migrate
    env_file:
      - ../.env
    volumes:
      - ../migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec migrate -path /migrations -database "$${DATABASE_URL}" up']
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in backend/.env}
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      PORT: "3000"
      # Server-only API URL used by SSR fetchers inside the Compose network.
      # The build arg (set above) bakes the browser-facing
      # NEXT_PUBLIC_API_URL into the client bundle.
      API_URL: "http://api:8080"
    env_file:
      - ../.env
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    ports:
      - "8081:8080"
    restart: unless-stopped
    environment:
      PORT: "8080"
    env_file:
      - ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    command: ./worker
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../.env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../seed/media:/seed/media:ro
    env_file:
      - ../.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /usr/bin/mc alias set myminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        /usr/bin/mc mb --ignore-existing myminio/catalog;
        /usr/bin/mc mb --ignore-existing myminio/product-thumbnails;
        /usr/bin/mc mb --ignore-existing myminio/product-media;
        /usr/bin/mc anonymous set download myminio/catalog;
        /usr/bin/mc anonymous set download myminio/product-thumbnails;
        /usr/bin/mc anonymous set download myminio/product-media;
        if [ -d /seed/media/catalog ]; then /usr/bin/mc cp --recursive /seed/media/catalog/ myminio/catalog/; fi;
        exit 0;

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    env_file:
      - ../.env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
