services:
  # ─── Frontend (Next.js) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/messages:/app/messages
      - ./frontend/next.config.mjs:/app/next.config.mjs
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/package.json:/app/package.json:ro
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # Server Components and route handlers must use the compose network.
      # NEXT_PUBLIC_API_URL stays host-facing for browser requests.
      API_URL: "http://api:8081"
      NEXT_PUBLIC_MEDIA_BASE_URL: "http://localhost:4566"
    env_file:
      - ./backend/.env
    depends_on:
      api:
        condition: service_healthy

  # ─── Backend API (Go / Air hot-reload) ──────────────────
  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "8081:8081"
    command: air -c configs/air.api.toml
    environment:
      PORT: "8081"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PORT}/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 25
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ─── Notification Worker (Go / Air hot-reload) ──────────
  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    command: air -c configs/air.worker.toml
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ─── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: prim
      POSTGRES_USER: prim
      POSTGRES_PASSWORD: prim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Database Migrations ────────────────────────────────
  migrate:
    image: migrate/migrate
    volumes:
      - ./backend/migrations:/migrations
    env_file:
      - ./backend/.env
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://prim:prim@postgres:5432/prim?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  # ─── LocalStack (S3 emulator) ───────────────────────────
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - floci_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_HOSTNAME: floci
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1

  # ─── S3 Init (seed buckets + data) ──────────────────────
  s3-init:
    image: amazon/aws-cli
    depends_on:
      floci:
        condition: service_healthy
    volumes:
      - ./backend/seed/media:/seed/media:ro
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    env_file:
      - ./backend/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://floci:4566 s3api create-bucket --bucket catalog 2>/dev/null || true;
        aws --endpoint-url http://floci:4566 s3api create-bucket --bucket product-thumbnails 2>/dev/null || true;
        aws --endpoint-url http://floci:4566 s3api create-bucket --bucket product-media 2>/dev/null || true;
        aws --endpoint-url http://floci:4566 s3api put-bucket-policy --bucket catalog --policy '{"Version":"2012-10-17","Statement":[{"Sid":"PublicRead","Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::catalog/*"}]}' 2>/dev/null || true;
        if [ -d /seed/media/catalog ]; then aws --endpoint-url http://floci:4566 s3 sync /seed/media/catalog/ s3://catalog/; fi;
        exit 0;

  # ─── Apache Kafka (KRaft mode) ─────────────────────────
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    env_file:
      - ./backend/.env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      # The JVM-based check needs ~11s to run; a shorter timeout SIGKILLs it.
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─── Mailpit (Local SMTP Server & Web Mailbox) ─────────
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  go-mod-cache:
  floci_data:
  kafka_data:
