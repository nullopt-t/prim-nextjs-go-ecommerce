services:
  # ─── Frontend (Next.js) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/messages:/app/messages
      - ./frontend/next.config.mjs:/app/next.config.mjs
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/package.json:/app/package.json:ro
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # Server Components and route handlers must use the compose network.
      # NEXT_PUBLIC_API_URL stays host-facing for browser requests.
      API_URL: "http://api:8081"
    env_file:
      - ./backend/.env
    depends_on:
      api:
        condition: service_healthy

  # ─── Backend API (Go / Air hot-reload) ──────────────────
  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "8081:8081"
    command: air -c configs/air.api.toml
    environment:
      PORT: "8081"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PORT}/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 25
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ─── Notification Worker (Go / Air hot-reload) ──────────
  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    command: air -c configs/air.worker.toml
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ─── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: prim
      POSTGRES_USER: prim
      POSTGRES_PASSWORD: prim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Database Migrations ────────────────────────────────
  migrate:
    image: migrate/migrate
    volumes:
      - ./backend/migrations:/migrations
    env_file:
      - ./backend/.env
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://prim:prim@postgres:5432/prim?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  # ─── MinIO (Object Storage) ─────────────────────────────
  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./backend/.env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO Init (seed buckets + data) ───────────────────
  minio-init:
    image: elestio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./backend/seed/media:/seed/media:ro
    env_file:
      - ./backend/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /usr/bin/mc alias set myminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        /usr/bin/mc mb --ignore-existing myminio/catalog;
        /usr/bin/mc mb --ignore-existing myminio/product-thumbnails;
        /usr/bin/mc mb --ignore-existing myminio/product-media;
        /usr/bin/mc anonymous set download myminio/catalog;
        /usr/bin/mc anonymous set download myminio/product-thumbnails;
        /usr/bin/mc anonymous set download myminio/product-media;
        if [ -d /seed/media/catalog ]; then /usr/bin/mc cp --recursive /seed/media/catalog/ myminio/catalog/; fi;
        exit 0;

  # ─── Apache Kafka (KRaft mode) ─────────────────────────
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    env_file:
      - ./backend/.env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      # The JVM-based check needs ~11s to run; a shorter timeout SIGKILLs it.
      timeout: 30s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  go-mod-cache:
  minio_data:
  kafka_data:
