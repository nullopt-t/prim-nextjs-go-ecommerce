x-app-env: &app-env # Database
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: prim
  DB_USER: prim
  DB_PASSWORD: prim

  # Redis
  REDIS_DB: "0"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""

  # Kafka
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_GROUP_ID: "prim-notification-workers"

  # SMTP
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  SMTP_USERNAME: ${SMTP_USERNAME}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
  SMTP_FROM_NAME: Prim

  # Server
  HTTP_PORT: "${HTTP_PORT:-8081}"

  # JWT
  JWT_ACCESS_SECRET: dev-access-secret
  JWT_REFRESH_SECRET: dev-refresh-secret
  JWT_RESET_PASS_SECRET: dev-reset-secret

  # Client
  CLIENT_BASE_URL: http://192.168.1.16:3000
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://192.168.1.16:3000,https://localhost:3000,https://192.168.1.16:3000"

  # MinIO
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_URL: http://192.168.1.16:9000
  MINIO_ACCESS_KEY: admin
  MINIO_SECRET_KEY: supersecret

  # App
  ENV: development

services:
  # ─── Frontend (Next.js) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/messages:/app/messages
      - ./frontend/next.config.mjs:/app/next.config.mjs
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/package.json:/app/package.json:ro
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://192.168.1.16:8081
      API_URL: http://api:${HTTP_PORT:-8081}
      WATCHPACK_POLLING: "true"
    depends_on:
      api:
        condition: service_healthy

  # ─── Backend API (Go / Air hot-reload) ──────────────────
  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "${HTTP_PORT:-8081}:${HTTP_PORT:-8081}"
    command: air -c configs/air.api.toml
    env_file:
      - ./backend/.env
    environment:
      <<: *app-env
      GOMAXPROCS: 4
      GOPROXY: "https://proxy.golang.org,https://goproxy.io,direct"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${HTTP_PORT:-8081}/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 25
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-prim}
      POSTGRES_USER: ${DB_USER:-prim}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prim}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${DB_USER:-prim} -d ${DB_NAME:-prim}"
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Database Migrations ────────────────────────────────
  migrate:
    image: migrate/migrate
    volumes:
      - ./backend/migrations:/migrations
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://${DB_USER:-prim}:${DB_PASSWORD:-prim}@postgres:5432/${DB_NAME:-prim}?sslmode=disable
    command: up
    depends_on:
      postgres:
        condition: service_healthy

  # ─── MinIO (Object Storage) ─────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-supersecret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO Init (seed buckets + data) ───────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./backend/seed/media:/seed/media:ro
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-admin} ${MINIO_SECRET_KEY:-supersecret};
      /usr/bin/mc mb --ignore-existing myminio/catalog;
      /usr/bin/mc anonymous set download myminio/catalog;
      if [ -d /seed/media/catalog ]; then /usr/bin/mc cp --recursive /seed/media/catalog/ myminio/catalog/; fi;
      exit 0;
      "

  # ─── Apache Kafka (KRaft mode) ─────────────────────────
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  go-mod-cache:
  minio_data:
  kafka_data:
