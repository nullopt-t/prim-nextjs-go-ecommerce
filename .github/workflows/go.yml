name: Go Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/go.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/go.yml"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Print Go version
        run: go version

      - name: Download dependencies
        env:
          GOPROXY: "https://proxy.golang.org,https://goproxy.io,direct"
          GONOSUMCHECK: "*"
        run: go mod download

      - name: Build all packages (Type-check gate)
        run: go build ./...

      - name: Run unit tests
        run: go test -v -race ./...
